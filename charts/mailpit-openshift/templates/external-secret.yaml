{{- if .Values.global.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mailpit-openshift.fullname" . }}-ui-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mailpit-openshift.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName | required "externalSecret.secretStoreName is required when externalSecret.enabled is true" }}
    kind: {{ .Values.externalSecret.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.global.externalSecret.targetSecretName | default "mailpit-ui-auth" }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: htpasswd
      remoteRef:
        key: {{ tpl .Values.externalSecret.remoteRef.key . | quote }}
        {{- if .Values.externalSecret.remoteRef.property }}
        property: {{ .Values.externalSecret.remoteRef.property | quote }}
        {{- end }}
{{- end }}