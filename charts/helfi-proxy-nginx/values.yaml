# -------------------------------------------------------
# helfi-proxy-nginx Helm chart default values
# -------------------------------------------------------

# Role of this deployment
# receiver   = helfi-nginx, serves Drupal compositing
# dispatcher = thin router owning the public www.hel.fi route
type: receiver

# -------------------------------------------------------
# Deployment
# -------------------------------------------------------
replicaCount: 2

image:
  registry: container-registry.platta-net.hel.fi
  repository: hki-kanslia-helfi-etusivu/helfi-proxy-nginx
  tag: stable-1.0
  pullPolicy: Always

imagePullSecrets:
  - name: quay-secret-hki-kanslia-helfi-etusivu

nameOverride: ""
fullnameOverride: ""

# -------------------------------------------------------
# Resources
# -------------------------------------------------------
resources:
  limits:
    cpu: "1"
    memory: 1.5Gi
  requests:
    cpu: 500m
    memory: 1Gi

# -------------------------------------------------------
# OpenShift node selector
# devtest / stg / prod
# -------------------------------------------------------
nodeSelector: devtest

# -------------------------------------------------------
# Route
# -------------------------------------------------------
route:
  enabled: true
  host: ""           # set per environment
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  annotations:
    haproxy.router.openshift.io/timeout: 300s
    haproxy.router.openshift.io/disable_cookies: "true"

# -------------------------------------------------------
# Health probes
# -------------------------------------------------------
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 240
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

# -------------------------------------------------------
# Receiver config (type: receiver)
# -------------------------------------------------------
receiver:
  serverName: ""           # set per environment e.g. www.test.hel.ninja
  openshiftIP: ""          # set per environment
  xForwardedHost: $host    # $host for test/staging, $xfh for prod (geo block)

  # Varnish backend hostnames — set per environment
  backends:
    etusivu: ""
    terveys: ""
    liikenne: ""
    asuminen: ""
    rekry: ""
    tyo-yrittaminen: ""
    kuva: ""
    kasvatus: ""
    strategia: ""
    uutisapi: ""
    sitemap: ""
  proxiedRoutes: []

# -------------------------------------------------------
# Redirections ConfigMap master switch
# Must be true for any redirections to be mounted.
# -------------------------------------------------------
redirections:
  enabled: false

# -------------------------------------------------------
# Env-jump redirects (test-/staging- prefix redirects)
# Only enable in prod receiver — www.hel.fi/fi/test-asuminen
# → https://www.test.hel.ninja/fi/asuminen etc.
# -------------------------------------------------------
envJumpRedirects:
  enabled: false
  testHost: www.test.hel.ninja
  stagingHost: www.stage.hel.ninja
  sections: []
  # - name: "Asuminen"
  #   test:
  #     fi: { from: "fi/test-asuminen", to: "fi/asuminen" }
  #     sv: { from: "sv/test-boende",   to: "sv/boende" }
  #     en: { from: "en/test-housing",  to: "en/housing" }
  #   staging:
  #     fi: { from: "fi/staging-asuminen", to: "fi/asuminen" }
  #     sv: { from: "sv/staging-boende",   to: "sv/boende" }
  #     en: { from: "en/staging-housing",  to: "en/housing" }

# -------------------------------------------------------
# Custom redirects — managed by helfi-team
# Any redirect that doesn't fit the env-jump pattern.
# -------------------------------------------------------
customRedirects:
  enabled: false
  rules: []
  # - from: "^/some-old-path$"
  #   to: "https://www.hel.fi/fi/new-path"
  #   type: 301        # default: 301
  #   matchType: "~*"  # default: ~* (case-insensitive regex)
  #                    # options: ~ (case-sensitive), "" (prefix match)

# -------------------------------------------------------
# Dispatcher config (type: dispatcher)
# Only used when type: dispatcher
# -------------------------------------------------------
dispatcher:
  openshiftIP: ""
  serverName: ""
  # List of path-based routing rules to internal ClusterIP services
  routes: []
  # - path: "^/(fi|sv|en)"
  #   backend: helfi-nginx
  #   port: 8080

# -------------------------------------------------------
# Additional OpenShift routes pointing to same service
# Used by dispatcher to own multiple hostnames
# e.g. hel.fi + www.hel.fi
# -------------------------------------------------------

additionalRoutes: []
# - host: hel.fi
#   redirect: true
#   tls:
#     enabled: true
#     termination: edge
#     insecureEdgeTerminationPolicy: Redirect
#   annotations:
#     haproxy.router.openshift.io/timeout: 300s