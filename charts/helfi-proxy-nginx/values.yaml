# -------------------------------------------------------
# helfi-proxy-nginx Helm chart default values
# -------------------------------------------------------

# Role of this deployment
# receiver   = helfi-nginx, serves Drupal compositing
# dispatcher = thin router owning the public www.hel.fi route
type: receiver

# -------------------------------------------------------
# Deployment
# -------------------------------------------------------
replicaCount: 2

image:
  registry: container-registry.platta-net.hel.fi
  repository: hki-kanslia-helfi-etusivu/helfi-proxy-nginx
  tag: stable-1.0
  pullPolicy: Always

imagePullSecrets:
  - name: quay-secret-hki-kanslia-helfi-etusivu

nameOverride: ""
fullnameOverride: ""

# -------------------------------------------------------
# Resources
# -------------------------------------------------------
resources:
  limits:
    cpu: "1"
    memory: 1.5Gi
  requests:
    cpu: 500m
    memory: 1Gi

# -------------------------------------------------------
# OpenShift node selector
# devtest / stg / prod
# -------------------------------------------------------
nodeSelector: devtest

# -------------------------------------------------------
# Route
# -------------------------------------------------------
route:
  enabled: true
  host: ""           # set per environment
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  annotations:
    haproxy.router.openshift.io/timeout: 300s
    haproxy.router.openshift.io/disable_cookies: "true"

# -------------------------------------------------------
# Health probes
# -------------------------------------------------------
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 240
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

# -------------------------------------------------------
# Receiver config (type: receiver)
# -------------------------------------------------------
receiver:
  serverName: ""           # set per environment e.g. www.test.hel.ninja
  openshiftIP: ""          # set per environment
  xForwardedHost: $host    # $host for test/staging, $xfh for prod (geo block)

  # Varnish backend hostnames — set per environment
  backends:
    etusivu: ""
    terveys: ""
    liikenne: ""
    asuminen: ""
    rekry: ""
    tyo-yrittaminen: ""
    kuva: ""
    kasvatus: ""
    strategia: ""
    uutisapi: ""
    sitemap: ""
  proxiedRoutes: []

# -------------------------------------------------------
# Rate limiting (nginx limit_req)
# receiver only. Each zone's limit_req_zone directive is
# rendered into the http{} context (base-nginx ConfigMap);
# the matching location block is rendered into the server
# ConfigMap
#
# IMPORTANT: limit_req_zone counters are per-pod, NOT
# shared across replicas. With replicaCount > 1, the real
# aggregate ceiling is approximately (rate * replicaCount).
# e.g. rate: "1r/s" with replicaCount: 2 → ~2 req/s actually
# reaching the backend. There is no cross-pod shared state
# -------------------------------------------------------
rateLimiting:
  enabled: false
  zones: []
  # - name: csp_report            # zone name — must be unique per zone
  #   rate: "1r/s"                 # PER-POD rate, see note above
  #   key: "global"                 # "global" = one shared counter for all traffic to these paths
  #   size: "10m"                  # shared memory zone size (optional, default 10m)
  #   burst: 0                     # optional, default 0
  #   nodelay: true                # optional, default true — reject immediately, don't queue
  #   methods: ["GET", "POST"]     # only these methods are rate limited; others get 405
  #   paths:                       # each must be a full anchored regex
  #     - "^/fi/log-report-uri/enforce$"
  #     - "^/sv/log-report-uri/enforce$"
  #     - "^/en/log-report-uri/enforce$"
  #   backendKey: "etusivu"        # key into receiver.backends — where accepted requests go
  #   responseCode: 204            # returned instead of nginx's default 503 when rate-limited

# -------------------------------------------------------
# Redirections ConfigMap master switch
# Must be true for any redirections to be mounted.
# -------------------------------------------------------
redirections:
  enabled: false

# -------------------------------------------------------
# Env-jump redirects (test-/staging- prefix redirects)
# Only enable in prod receiver — www.hel.fi/fi/test-asuminen
# → https://www.test.hel.ninja/fi/asuminen etc.
# -------------------------------------------------------
envJumpRedirects:
  enabled: false
  testHost: www.test.hel.ninja
  stagingHost: www.stage.hel.ninja
  sections: []
  # - name: "Asuminen"
  #   test:
  #     fi: { from: "fi/test-asuminen", to: "fi/asuminen" }
  #     sv: { from: "sv/test-boende",   to: "sv/boende" }
  #     en: { from: "en/test-housing",  to: "en/housing" }
  #   staging:
  #     fi: { from: "fi/staging-asuminen", to: "fi/asuminen" }
  #     sv: { from: "sv/staging-boende",   to: "sv/boende" }
  #     en: { from: "en/staging-housing",  to: "en/housing" }

# -------------------------------------------------------
# Custom redirects — managed by helfi-team
# Any redirect that doesn't fit the env-jump pattern.
# -------------------------------------------------------
customRedirects:
  enabled: false
  rules: []
  # - from: "^/some-old-path$"
  #   to: "https://www.hel.fi/fi/new-path"
  #   type: 301        # default: 301
  #   matchType: "~*"  # default: ~* (case-insensitive regex)
  #                    # options: ~ (case-sensitive), "" (prefix match)

# -------------------------------------------------------
# Dispatcher config (type: dispatcher)
# Only used when type: dispatcher
# -------------------------------------------------------
dispatcher:
  openshiftIP: ""
  serverName: ""
  # List of path-based routing rules to internal ClusterIP services
  routes: []
  # - path: "^/(fi|sv|en)"
  #   backend: helfi-nginx
  #   port: 8080

# -------------------------------------------------------
# Additional OpenShift routes pointing to same service
# Used by dispatcher to own multiple hostnames
# e.g. hel.fi + www.hel.fi
# -------------------------------------------------------

additionalRoutes: []
# - host: hel.fi
#   redirect: true
#   tls:
#     enabled: true
#     termination: edge
#     insecureEdgeTerminationPolicy: Redirect
#   annotations:
#     haproxy.router.openshift.io/timeout: 300s