apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helfi-proxy-nginx.fullname" . }}-server
  labels:
    {{- include "helfi-proxy-nginx.labels" . | nindent 4 }}
data:
{{- if eq .Values.type "receiver" }}
  server.conf: |
    server {
        listen       8080;
        listen       [::]:8080;
        server_name  {{ .Values.receiver.serverName }};
        root         /var/www/html/public;

        # Keep alive
        proxy_http_version 1.1;
        proxy_set_header   "Connection" "";

        # Gzip compression
        gzip on;
        gunzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_types application/x-javascript text/css text/javascript;

        # Buffer tuning
        proxy_busy_buffers_size   512k;
        proxy_buffers             4 512k;
        proxy_buffer_size         256k;
        proxy_headers_hash_max_size 1024;
        proxy_headers_hash_bucket_size 128;

        # Timeouts
        proxy_read_timeout 300;

        # Large file uploads
        client_max_body_size 32M;

        # Prevent port/server name change on redirect
        port_in_redirect off;
        server_name_in_redirect off;
        absolute_redirect off;

        # Security headers
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Frame-Options "Sameorigin" always;
        add_header X-Content-Type-Options "nosniff";
        add_header Keep-Alive "timeout=10, max=100";
        add_header Connection "Keep-Alive";

        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNetMvc-Version;
        proxy_hide_header X-AspNet-Version;

        # Error pages
        location = /errorpages/virhe_sivu.html {}
        error_page 400 401 402 403 410 500 502 503 504 /errorpages/virhe_sivu.html;

        location ~ ^/(assets|static|hel2)(/|$) {
            error_page 404 /errorpages/virhe_sivu.html;
        }

        error_page 404 = @redirect_to_live_404;
        location @redirect_to_live_404 {
            return 301 https://{{ .Values.receiver.serverName }}/fi/404?from=$request_uri;
        }

        set $openshift_ip {{ .Values.receiver.openshiftIP }};

        proxy_set_header X-Forwarded-Host {{ .Values.receiver.xForwardedHost }};
        proxy_set_header X-Forwarded-By '';
        proxy_set_header X-Forwarded '';

        # -------------------------------------------------------
        # Metatavu search (Fixed targets)
        # -------------------------------------------------------
        location ~ ^\/haku\/(?:.*)\.(css|json|js)$ {
            proxy_ssl_server_name on;
            set $args '';
            proxy_pass https://helsinki-search-results.metatavu.io;
            proxy_set_header Host helsinki-search-results.metatavu.io;
        }
        location ~ ^/haku/? {
            proxy_ssl_server_name on;
            set $args 'locale=fi';
            rewrite (?i)^/haku/(.*)$ /$1 break;
            proxy_pass https://helsinki-search-results.metatavu.io;
            proxy_set_header Host helsinki-search-results.metatavu.io;
        }
        location ~ ^/sok/? {
            proxy_ssl_server_name on;
            set $args 'locale=sv';
            rewrite (?i)^/sok/(.*)$ /$1 break;
            proxy_pass https://helsinki-search-results.metatavu.io;
            proxy_set_header Host helsinki-search-results.metatavu.io;
        }
        location ~ ^/search/? {
            proxy_ssl_server_name on;
            set $args 'locale=en';
            rewrite (?i)^/search/(.*)$ /$1 break;
            proxy_pass https://helsinki-search-results.metatavu.io;
            proxy_set_header Host helsinki-search-results.metatavu.io;
        }

        # -------------------------------------------------------
        # Dynamic Proxied Routes (Managed via Values)
        # -------------------------------------------------------
        {{- range .Values.receiver.proxiedRoutes }}
        # {{ .name }}
        location {{ .matchType | default "~ ^/" }}{{ .paths }} {
            proxy_set_header Host {{ index $.Values.receiver.backends .backendKey }};
            proxy_pass https://$openshift_ip:443{{ .proxyPath | default "" }};
        }
        {{- end }}

        {{- if .Values.redirections.enabled }}
        # -------------------------------------------------------
        # Env-jump and custom redirects
        # Included here so location blocks are scoped to
        # server_name {{ .Values.receiver.serverName }} only
        # -------------------------------------------------------
        include /etc/nginx/conf.d/redirections.conf;
        {{- end }}

        # -------------------------------------------------------
        # Etusivu — keep last, catch-all for language prefixes
        # -------------------------------------------------------
        location ~ ^/(fi|sv|en|ar|de|es|et|fa|uk|zh|zh-hans|se|so|fr|ru|etusivu|etusivu-assets/) {
            proxy_set_header Host {{ .Values.receiver.backends.etusivu }};
            proxy_pass https://$openshift_ip:443;
        }
    }

{{- else if eq .Values.type "dispatcher" }}
  server.conf: |
    server {
        listen       8080;
        listen       [::]:8080;
        server_name  {{ .Values.route.host }};
        server_name  {{ .Values.dispatcher.serverName }};
        root         /var/www/html/public;

        proxy_http_version 1.1;
        proxy_set_header "Connection" "";
 
        # Gzip
        gzip on;
        gunzip on;
        gzip_vary on;
 
        # Buffer tuning
        proxy_busy_buffers_size   512k;
        proxy_buffers             4 512k;
        proxy_buffer_size         256k;
        proxy_headers_hash_max_size 1024;
        proxy_headers_hash_bucket_size 128;
 
        # Timeouts
        proxy_read_timeout 300;

        # Security headers
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Frame-Options "Sameorigin" always;
        add_header X-Content-Type-Options "nosniff";

        # Error pages
        location = /errorpages/virhe_sivu.html {}
        error_page 400 401 402 403 410 500 502 503 504 /errorpages/virhe_sivu.html;

        proxy_set_header X-Forwarded-Host $xfh;
        proxy_set_header X-Forwarded-By '';
        proxy_set_header X-Forwarded '';

        # -------------------------------------------------------
        # Path-based routing to internal ClusterIP services
        # -------------------------------------------------------
        {{- range .Values.dispatcher.routes }}
        location {{ .path }} {
            proxy_pass http://{{ .backend }}:{{ .port }};
            proxy_set_header Host $host;
        }
        {{- end }}
    }

    {{- if .Values.additionalRoutes }}
    # -------------------------------------------------------
    # Additional server blocks (e.g. hel.fi → www.hel.fi)
    # -------------------------------------------------------
    {{- range .Values.additionalRoutes }}
    server {
        listen       8080;
        listen       [::]:8080;
        server_name  {{ .host }};
        root         /var/www/html/public;

        # Security headers
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Frame-Options "Sameorigin" always;
        add_header X-Content-Type-Options "nosniff";

        # Error pages
        location = /errorpages/virhe_sivu.html {}
        error_page 400 401 402 403 410 500 502 503 504 /errorpages/virhe_sivu.html;

        {{- if .redirect }}
        # Redirect this hostname to primary host
        return 301 https://{{ $.Values.dispatcher.serverName }}$request_uri;
        {{- end }}
    }
    {{- end }}
    {{- end }}

{{- end }}