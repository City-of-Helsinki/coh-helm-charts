{{- if .Values.redirections.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helfi-proxy-nginx.fullname" . }}-redirections
  labels:
    {{- include "helfi-proxy-nginx.labels" . | nindent 4 }}
data:
  redirections.conf: |
    {{- if .Values.envJumpRedirects.enabled }}
    # -------------------------------------------------------
    # Env-jump convenience redirects
    # www.hel.fi/fi/test-X → www.test.hel.ninja/fi/X
    # www.hel.fi/fi/staging-X → www.stage.hel.ninja/fi/X
    # Managed via values.yaml envJumpRedirects.sections
    # -------------------------------------------------------
    {{- range .Values.envJumpRedirects.sections }}
    # {{ .name }}
    {{- with .test }}
    location ~* ^/{{ .fi.from }}/?$ {
      return 302 https://{{ $.Values.envJumpRedirects.testHost }}/{{ .fi.to }};
    }
    location ~* ^/{{ .sv.from }}/?$ {
      return 302 https://{{ $.Values.envJumpRedirects.testHost }}/{{ .sv.to }};
    }
    location ~* ^/{{ .en.from }}/?$ {
      return 302 https://{{ $.Values.envJumpRedirects.testHost }}/{{ .en.to }};
    }
    {{- end }}
    {{- with .staging }}
    location ~* ^/{{ .fi.from }}/?$ {
      return 302 https://{{ $.Values.envJumpRedirects.stagingHost }}/{{ .fi.to }};
    }
    location ~* ^/{{ .sv.from }}/?$ {
      return 302 https://{{ $.Values.envJumpRedirects.stagingHost }}/{{ .sv.to }};
    }
    location ~* ^/{{ .en.from }}/?$ {
      return 302 https://{{ $.Values.envJumpRedirects.stagingHost }}/{{ .en.to }};
    }
    {{- end }}
    {{- end }}
    {{- end }}

    {{- if .Values.customRedirects.enabled }}
    # -------------------------------------------------------
    # Custom redirects
    # Managed via values.yaml customRedirects.rules
    # -------------------------------------------------------
    {{- range .Values.customRedirects.rules }}
    location {{ .matchType | default "~*" }} {{ .from }} {
      return {{ .type | default 301 }} {{ .to }};
    }
    {{- end }}
    {{- end }}
{{- end }}