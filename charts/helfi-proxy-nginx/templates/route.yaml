{{- if .Values.route.enabled }}
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{ include "helfi-proxy-nginx.fullname" . }}
  labels:
    {{- include "helfi-proxy-nginx.labels" . | nindent 4 }}
    {{- with .Values.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- toYaml .Values.route.annotations | nindent 4 }}
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: {{ include "helfi-proxy-nginx.fullname" . }}
    weight: 100
  port:
    targetPort: 8080-tcp
  {{- if .Values.route.tls.enabled }}
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
  {{- end }}
  {{- with .Values.route.httpHeaders }}
  httpHeaders:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  wildcardPolicy: None
{{- end }}

{{- if .Values.additionalRoutes }}
{{- range .Values.additionalRoutes }}
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{ include "helfi-proxy-nginx.fullname" $ }}-{{ .host | replace "." "-" }}
  labels:
    {{- include "helfi-proxy-nginx.labels" $ | nindent 4 }}
    {{- /* route.labels for all routes, per-route labels win */}}
    {{- with mergeOverwrite (deepCopy (default dict $.Values.route.labels)) (default dict .labels) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- toYaml .annotations | nindent 4 }}
spec:
  host: {{ .host }}
  to:
    kind: Service
    name: {{ include "helfi-proxy-nginx.fullname" $ }}
    weight: 100
  port:
    targetPort: 8080-tcp
  {{- if .tls.enabled }}
  tls:
    termination: {{ .tls.termination }}
    insecureEdgeTerminationPolicy: {{ .tls.insecureEdgeTerminationPolicy }}
  {{- end }}
  {{- /* per-route httpHeaders win; set httpHeaders: {} on a route to send none */}}
  {{- with (hasKey . "httpHeaders" | ternary .httpHeaders $.Values.route.httpHeaders) }}
  httpHeaders:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  wildcardPolicy: None
{{- end }}
{{- end }}