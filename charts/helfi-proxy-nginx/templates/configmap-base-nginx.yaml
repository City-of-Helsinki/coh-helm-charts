apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helfi-proxy-nginx.fullname" . }}-base-nginx
  labels:
    {{- include "helfi-proxy-nginx.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr;
    pid /tmp/nginx.pid;

    include /usr/share/nginx/modules/*.conf;

    events {
        worker_connections 1024;
    }

    http {
        # Define JSON Log Format
        log_format json_analytics escape=json '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status": "$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"http_x_forwarded_host":"$http_x_forwarded_host",'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status"'
        '}';

        access_log /dev/stdout json_analytics;

        sendfile            on;
        tcp_nopush          on;
        tcp_nodelay         on;
        keepalive_timeout   65;
        types_hash_max_size 4096;

        include             /etc/nginx/mime.types;
        default_type        application/octet-stream;

        # geo block — sets $xfh used in prod for X-Forwarded-Host
        # In test/staging, receiver uses $host directly instead
        geo $xfh {
            default www.hel.fi;
        }

        # Load server block configs from default.d/
        include /etc/nginx/default.d/*.conf;

        server {
            listen       8080 default_server;
            listen       [::]:8080 default_server;
            server_name  _;
            root         /var/www/html/public;

            # Health probes
            location /healthz {
                access_log off;
                return 200 '{"status":"UP"}';
                add_header Content-Type application/json;
            }
            location /readiness {
                access_log off;
                return 200 '{"status":"UP"}';
                add_header Content-Type application/json;
            }

            # Load default location rules from conf.d/
            include /etc/nginx/conf.d/*.conf;
        }
    }