apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helfi-proxy-nginx.fullname" . }}-base-nginx
  labels:
    {{- include "helfi-proxy-nginx.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/opt/rh/rh-nginx126/log/nginx/error.log;
    pid /var/opt/rh/rh-nginx126/run/nginx/nginx.pid;

    include /usr/share/nginx/modules/*.conf;

    events {
        worker_connections 1024;
    }

    http {
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/opt/rh/rh-nginx126/log/nginx/access.log  main;

        sendfile            on;
        tcp_nopush          on;
        tcp_nodelay         on;
        keepalive_timeout   65;
        types_hash_max_size 4096;

        include             /etc/nginx/mime.types;
        default_type        application/octet-stream;

        # geo block — sets $xfh used in prod for X-Forwarded-Host
        # In test/staging, receiver uses $host directly instead
        geo $xfh {
            default www.hel.fi;
        }

        # Load server block configs from default.d/
        include /etc/nginx/default.d/*.conf;

        server {
            listen       8080 default_server;
            listen       [::]:8080 default_server;
            server_name  _;
            root         /var/www/html/public;

            # Health probes for OpenShift liveness/readiness
            location /healthz {
                access_log off;
                return 200 '{"status":"UP"}';
                add_header Content-Type application/json;
            }
            location /readiness {
                access_log off;
                return 200 '{"status":"UP"}';
                add_header Content-Type application/json;
            }

            # Load default location rules from conf.d/
            include /etc/nginx/conf.d/*.conf;
        }
    }
