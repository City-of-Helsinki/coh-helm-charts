nginx:
  useCase: "elastic-proxy"
# ============================================================================
# ELASTIC PROXY USE CASE CONFIGURATION (Overrides)
# ============================================================================
elasticProxy:
  enabled: true
  upstreamAuth:
    enabled: true                               
    secretName: "elasticsearch-test-es-elastic-user"
    username: "elastic"                
    passwordKey: "elastic"                      
  
  upstream:
    url: "https://elasticsearch-test-es-http.platta-components-helm-ci.svc.cluster.local:9200" # ELASTICSEARCH_URL env var

# ============================================================================
# OPENSHIFT ROUTE CONFIGURATION 
# ============================================================================
routes:
  enabled: true
  items:
    - nameSuffix: "" # Creates a route named: {{ .Release.Name }}-nginx-standard
      host: "test-elastic-proxy.test-se.hel.ninja"
      path: ""
    - nameSuffix: "-internal" # Creates a route named: {{ .Release.Name }}-nginx-standard-internal
      host: "test-elastic-proxy-api.test-se.hel.ninja"
      path: "/internal"