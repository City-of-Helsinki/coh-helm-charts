nginx:
  useCase: "cache"
  replicaCount: 1

cache:
  enabled: true
  defaultBackendUrl: "https://elasticsearch-test-es-http.nginx-demo.svc.cluster.local:9200"
  clientMaxBodySize: "50m"
  volumeSize: "1Gi"
  serverDirectives: []
  proxy:
    buffersNumber: 1024
    bufferSize: "4k"
    sendTimeout: "30s"
    readTimeout: "30s"
    connectTimeout: "30s"
  
  zones:
    - keysZone: "default_cache:10m"
      path: "/srv/cache/default"
      levels: "1:2"
      maxSize: "100m"
      inactive: "5m"
      useTempPath: "off"
      
  namedLocations:
  - name: dummy
    internal: true
    additionalConfig: "return 404;"
  
  locations:
    - path: "/"
      backendUrl: "https://elasticsearch-test-es-http.nginx-demo.svc.cluster.local:9200"
      cache:
        enabled: true
        zone: "default_cache"
        key: "$scheme$proxy_host$request_uri"
        validTime:
          default: "30s"  # Short TTL for testing
        addHeader: true
        headerName: "X-Cache-Status"
      additionalConfig: |
        # Add cache key to header for debugging
        add_header X-Cache-Key "$http_authorization$scheme$proxy_host$request_uri";
        add_header X-Cache-Hash "$http_authorization$scheme$proxy_host";

routes:
  enabled: false