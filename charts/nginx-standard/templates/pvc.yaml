{{- if and (eq .Values.nginx.useCase "file-sharing") .Values.fileSharing.enabled .Values.fileSharing.storage.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nginx-standard.pvcName" . }}
  namespace: {{ include "nginx-standard.namespace" . }}
  labels:
    {{- include "nginx-standard.labels" . | nindent 4 }}
    {{- if .Values.fileSharing.storage.mode }}
    storage-mode: {{ .Values.fileSharing.storage.mode }}
    {{- end }}
spec:
  accessModes:
    - {{ .Values.fileSharing.storage.pvc.accessMode | default "ReadWriteMany" }}
  resources:
    requests:
      storage: {{ .Values.fileSharing.storage.pvc.size }}
  {{- if .Values.fileSharing.storage.pvc.storageClassName }}
  storageClassName: {{ .Values.fileSharing.storage.pvc.storageClassName }}
  {{- end }}
  {{- if and (eq .Values.fileSharing.storage.mode "static") .Values.fileSharing.storage.pvc.volumeName }}
  # Static mode: Bind to pre-created PV
  volumeName: {{ .Values.fileSharing.storage.pvc.volumeName }}
  {{- end }}
  # If volumeName is empty and storageClassName is set, dynamic provisioning will occur
{{- end }}