{{- if eq (include "nginx-standard.externalSecretsEnabled" .) "true" }}
{{- $kv := .Values.externalSecrets.azureKeyVault }}
apiVersion: {{ include "nginx-standard.externalSecretsApiVersion" . }}
kind: ExternalSecret
metadata:
  name: {{ include "nginx-standard.externalSecretName" . }}
  namespace: {{ include "nginx-standard.namespace" . }}
  labels:
    {{- include "nginx-standard.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "nginx-standard.secretStoreName" . }}
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: {{ include "nginx-standard.secretName" . }}
  # Only the two storage keys are fetched; the target keys are the ones the Azure File driver expects
  data:
    - secretKey: azurestorageaccountname
      remoteRef:
        key: {{ $kv.storageAccountNameKey | default "AZURE-STORAGE-ACCOUNT-NAME" }}
    - secretKey: azurestorageaccountkey
      remoteRef:
        key: {{ $kv.storageAccountKeyKey | default "AZURE-STORAGE-ACCOUNT-KEY" }}
{{- end }}
