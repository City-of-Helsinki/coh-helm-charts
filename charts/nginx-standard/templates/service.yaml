apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-standard.fullname" . }}-svc
  namespace: {{ include "nginx-standard.namespace" . }}
  labels:
    {{- include "nginx-standard.labels" . | nindent 4 }}
spec:
  ports:
    - name: {{ include "nginx-standard.serviceName" . }}
      protocol: TCP
      port: {{ include "nginx-standard.servicePort" . }}
      targetPort: {{ include "nginx-standard.servicePort" . }}
    {{- if and .Values.observability.metrics.enabled (eq .Values.observability.metrics.type "prometheus_exporter") }}
    - name: metrics
      protocol: TCP
      port: {{ .Values.observability.metrics.prometheusExporter.port }}
      targetPort: {{ .Values.observability.metrics.prometheusExporter.port }}
    {{- end }}
  selector:
    {{- include "nginx-standard.selectorLabels" . | nindent 4 }}
  type: {{ .Values.nginx.service.type | default "ClusterIP" }}
  sessionAffinity: None