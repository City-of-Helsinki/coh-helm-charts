apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx-standard.fullname" . }}-deployment
  namespace: {{ include "nginx-standard.namespace" . }}
  labels:
    {{- include "nginx-standard.labels" . | nindent 4 }}
spec:
  replicas: {{ include "nginx-standard.replicaCount" . }}
  selector:
    matchLabels:
      {{- include "nginx-standard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nginx-standard.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "nginx-standard.serviceAccountName" . }}
      {{- end }}
      {{- if .Values.nginx.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.nginx.image.pullSecrets | nindent 8 }}
      {{- end }}
      volumes:
        {{- if eq (include "nginx-standard.fileSharingEnabled" .) "true" }}
        - name: file-content-volume
          {{- if .Values.fileSharing.storage.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nginx-standard.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: config-volume
          configMap:
            name: {{ include "nginx-standard.configmapName" . }}
            items:
              - key: nginx.conf
                path: nginx.conf
              - key: server.conf
                path: nginx.default.d/server.conf
              {{- if and (eq .Values.nginx.useCase "front-proxy") (hasKey .Values.frontProxy.env "PROXY_IP") }}
              # Mount the custom IP list file for the GEO block
              - key: proxy_ips.conf
                path: proxy_ips.conf
              {{- end }}
            defaultMode: 420
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ include "nginx-standard.image" . }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if eq (include "nginx-standard.elasticProxyEnabled" .) "true" }}
            - name: ELASTICSEARCH_URL
              value: {{ .Values.elasticProxy.upstream.url | required "elasticProxy.upstream.url is required for elastic-proxy use case" }}
            - name: ELASTIC_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticProxy.authSecretName | default (include "nginx-standard.fullname" .) }}
                  key: user
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticProxy.authSecretName | default (include "nginx-standard.fullname" .) }}
                  key: password
            {{- end }}

            {{- if eq (include "nginx-standard.frontProxyEnabled" .) "true" }}
            # FRONT PROXY ENV VARS (Plain values from values.yaml)
            {{- range $key, $val := .Values.frontProxy.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range $key, $val := .Values.frontProxy.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $val.secretName }}
                  key: {{ $val.secretKey }}
            {{- end }}
            {{- end }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              # Copy custom nginx.conf to the main config directory
              if [ -f /opt/app-root/etc/nginx.conf ]; then
                cp /opt/app-root/etc/nginx.conf /etc/nginx/nginx.conf
              fi
              # Start NGINX
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: {{ include "nginx-standard.servicePort" . }}
              protocol: TCP
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            {{- if eq (include "nginx-standard.fileSharingEnabled" .) "true" }}
            - name: file-content-volume
              mountPath: {{ .Values.fileSharing.storage.mountPath | default "/opt/app-root/src" }}
            {{- end }}
            - name: config-volume
              mountPath: /opt/app-root/etc
          {{- if eq (include "nginx-standard.healthChecksEnabled" .) "true" }}
          readinessProbe:
            httpGet:
              path: {{ include "nginx-standard.readinessPath" . }}
              port: {{ include "nginx-standard.servicePort" . }}
              scheme: HTTP
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ include "nginx-standard.livenessPath" . }}
              port: {{ include "nginx-standard.servicePort" . }}
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          {{- end }}
      {{- with .Values.nginx.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      nodeSelector:
        env: {{ .Values.global.environment | default "prod" }}
      {{- end }}
      {{- with .Values.nginx.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nginx.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30