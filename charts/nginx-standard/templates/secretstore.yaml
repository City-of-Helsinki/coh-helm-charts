{{- if eq (include "nginx-standard.secretStoreCreate" .) "true" }}
apiVersion: {{ include "nginx-standard.externalSecretsApiVersion" . }}
kind: SecretStore
metadata:
  name: {{ include "nginx-standard.secretStoreName" . }}
  namespace: {{ include "nginx-standard.namespace" . }}
  labels:
    {{- include "nginx-standard.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      authSecretRef:
        clientId:
          key: clientId
          name: {{ .Values.externalSecrets.servicePrincipal.secretName | default "azure-service-principal" }}
        clientSecret:
          key: clientSecret
          name: {{ .Values.externalSecrets.servicePrincipal.secretName | default "azure-service-principal" }}
      authType: ServicePrincipal
      environmentType: PublicCloud
      tenantId: {{ .Values.externalSecrets.azureKeyVault.tenantId | required "externalSecrets.azureKeyVault.tenantId is required when the chart creates the SecretStore" }}
      vaultUrl: {{ required "externalSecrets.azureKeyVault.vaultName is required when the chart creates the SecretStore" .Values.externalSecrets.azureKeyVault.vaultName | printf "https://%s.vault.azure.net" }}
{{- end }}
