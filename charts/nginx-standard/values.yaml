# Default values for nginx-standard
# This Helm chart supports multiple NGINX use cases:
# - file-sharing: Static file server with directory listing
# - elastic-proxy: Reverse proxy for Elasticsearch with method restrictions

global:
  namespace: ""  # Override with --namespace or uses .Release.Namespace

# Optional overrides for resource naming
nameOverride: ""
fullnameOverride: ""

# ============================================================================
# NGINX CONFIGURATION
# ============================================================================
nginx:
  # Use case selector: "file-sharing" | "elastic-proxy"
  useCase: "file-sharing"
  
  # Number of replica pods
  replicaCount: 2
  
  # Container image configuration
  image:
    full: ''
    pullPolicy: "IfNotPresent"
    pullSecrets: 
      - name: "quay-secret-new"
  
  # Node selector for pod placement
  nodeSelector: {}
    # env: "prod"
  
  # Pod tolerations
  tolerations: []
    # - key: "dedicated"
    #   operator: "Equal"
    #   value: "nginx"
    #   effect: "NoSchedule"
  
  # Pod affinity rules
  affinity: {}
    # podAntiAffinity:
    #   preferredDuringSchedulingIgnoredDuringExecution:
    #   - weight: 100
    #     podAffinityTerm:
    #       labelSelector:
    #         matchExpressions:
    #         - key: app.openshift.io/name
    #           operator: In
    #           values:
    #           - nginx-standard
    #       topologyKey: openshift.io/hostname
  
  # Resource requests and limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Service configuration
  service:
    port: 8080
    targetPort: 8080
    name: "http"
    type: "ClusterIP"
  
  # Health check probes (standardized endpoints)
  healthChecks:
    enabled: true
    readinessPath: "/readiness"
    livenessPath: "/healthz"
  
  # Logging configuration for containers
  logging:
    accessLog: "/dev/stdout"
    errorLog: "/dev/stderr"
    errorLevel: "warn"
    
    # Log format: json | combined | main | custom
    format: "json"
    
    # JSON log format configuration (application-aligned)
    jsonFormat:
      enabled: true
      fields:
        timestamp: "$time_iso8601"
        level: "info"
        source: "nginx"
        message: "$request"
        request_id: "$http_x_request_id"
        client_ip: "$remote_addr"
        method: "$request_method"
        uri: "$request_uri"
        protocol: "$server_protocol"
        status: "$status"
        response_time: "$request_time"
        bytes_sent: "$body_bytes_sent"
        user_agent: "$http_user_agent"
        referer: "$http_referer"
        x_forwarded_for: "$http_x_forwarded_for"
        upstream_addr: "$upstream_addr"
        upstream_response_time: "$upstream_response_time"
  
  # Security headers configuration
  security:
    headers:
      enabled: false
      csp: "default-src 'self'"
      sts: "max-age=31536000; includeSubDomains; preload"
      frameOptions: "DENY"
      contentTypeOptions: "nosniff"
      xssProtection: "1; mode=block"
    authHeaders:
      maxSize: "16k"
      bufferSize: "16k"

# ============================================================================
# FILE SHARING USE CASE CONFIGURATION
# ============================================================================
fileSharing:
  enabled: false
  
  # Storage configuration
  storage:
    # Persistent Volume Claim
    pvc:
      enabled: true
      size: "10Gi"
      storageClassName: "azurefile"
      accessMode: "ReadWriteMany"
      volumeName: ""  # Auto-generated if empty
      
      # Azure File specific configuration
      azureFile:
        enabled: true
        shareName: "fileshare"
        secretName: ""  # Auto-generated from external secrets if empty
        capacity: ""  # Uses pvc.size if empty
        volumeName: ""  # Auto-generated if empty
    
    # Mount path inside the container
    mountPath: "/opt/app-root/src"
  
  # NGINX location blocks for file sharing
  locations:
    - path: "/"
      root: "/opt/app-root/src"
      index: "index.html index.htm"
      autoindex: true
      additionalConfig: |
        # Additional NGINX directives
        # autoindex_exact_size off;
        # autoindex_localtime on;
    
    # Example: Serve specific subdirectory
    # - path: "/downloads"
    #   alias: "/opt/app-root/src/downloads/"
    #   autoindex: true
    #   additionalConfig: |
    #     autoindex_exact_size off;

# ============================================================================
# ELASTIC PROXY USE CASE CONFIGURATION
# ============================================================================
elasticProxy:
  enabled: false # Set to true when using elastic-proxy use case
  authSecretName: ""
  # Upstream Elasticsearch configuration
  upstream:
    url: "https://elasticsearch-host.cluster.svc:9200" # ELASTICSEARCH_URL env var
  
  # Proxy settings
  proxy:
    connectTimeout: "5s"
    sendTimeout: "60s"
    readTimeout: "60s"
    bufferSize: "8k"
    buffersNumber: 4
  
  # Elasticsearch routes with method restrictions
  routes:
    # Search endpoints
    - path: "~ ^/([a-z][a-z_,-]*)/(_search|_msearch)$" # Corrected regex from user's original helper
      methods: ["POST", "GET"]
      additionalConfig: |
        # Additional NGINX directives
    
    # Cluster health
    - path: "/_cluster/health"
      methods: ["GET"]
    
    # Ping endpoint
    - path: "/ping"
      methods: ["GET"]

# ============================================================================
# EXTERNAL SECRETS CONFIGURATION (Azure Key Vault)
# ============================================================================
externalSecrets:
  enabled: false
  refreshInterval: "1h"  # How often to sync secrets from Key Vault
  
  # Azure Key Vault configuration
  azureKeyVault:
    vaultName: ""  # REQUIRED: Your Azure Key Vault name
    tenantId: ""   # REQUIRED: Azure tenant ID
    
    # Key names in Azure Key Vault for storage credentials
    storageAccountNameKey: "AZURE-STORAGE-ACCOUNT-NAME"
    storageAccountKeyKey: "AZURE-STORAGE-ACCOUNT-KEY"
  
  # Service Principal for Key Vault authentication
  servicePrincipal:
    secretName: "azure-service-principal"

# ============================================================================
# OPENSHIFT ROUTE CONFIGURATION
# ============================================================================
route:
  enabled: false
  
  # Route annotations
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000;includeSubDomains;preload"
    haproxy.router.openshift.io/disable_cookies: "true"
    # haproxy.router.openshift.io/timeout: "30s"
  
  # Route hostname
  host: ""  # REQUIRED when route.enabled is true
  
  # TLS configuration
  tls:
    enabled: true
    termination: "edge"  # edge | passthrough | reencrypt
    insecureEdgeTerminationPolicy: "Redirect"  # Redirect | Allow | None

# ============================================================================
# SERVICE ACCOUNT CONFIGURATION
# ============================================================================
serviceAccount:
  create: false
  
  # Annotations to add to the service account
  annotations: {}
  
  # The name of the service account to use
  name: ""

# ============================================================================
# POD ANNOTATIONS
# ============================================================================
podAnnotations: {}
  # prometheus.io/scrape: "true"
  # prometheus.io/port: "8080"
  # prometheus.io/path: "/metrics"