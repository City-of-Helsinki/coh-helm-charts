nginx:
  useCase: "elastic-proxy"
# ============================================================================
# ELASTIC PROXY USE CASE CONFIGURATION (Overrides)
# ============================================================================
elasticProxy:
  enabled: true
  
  upstream:
    service: "elasticsearch-client-service"
    port: 9200
    protocol: "https" # Use https to backend
  
  proxy:
    # Adjusting timeouts is common for reverse proxies
    readTimeout: "90s" 
  
  routes:
    # Standard read-only routes
    - path: "~ ^/(.*)/_search$"
      methods: ["POST", "GET"]
    - path: "~ ^/(.*)/_msearch$"
      methods: ["POST", "GET"]
    - path: "/_cluster/health"
      methods: ["GET"]
# ============================================================================
# OPENSHIFT ROUTE CONFIGURATION (Enabled)
# ============================================================================
# route:
#   enabled: true
#   host: "search.example.com" # REQUIRED
  
#   annotations:
#     haproxy.router.openshift.io/timeout: "90s" # Longer timeout for search queries