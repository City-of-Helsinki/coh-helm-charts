# Test values for File Sharing Use Case
# This file demonstrates a complete file sharing configuration with Azure File Storage

global:
  namespace: "nginx-test"
  project: "file-sharing-demo"
  environment: "dev"

nameOverride: "fileshare"
fullnameOverride: ""

# ============================================================================
# NGINX Configuration - File Sharing
# ============================================================================
nginx:
  useCase: "file-sharing"
  replicaCount: 2
  
  image:
    repository: "registry.access.redhat.com/ubi9/nginx-120"
    tag: "latest"
    pullPolicy: "IfNotPresent"
    pullSecrets: []
  
  nodeSelector:
    env: "devtest"
  
  tolerations: []
  affinity: {}
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  
  service:
    port: 8080
    targetPort: 8080
    name: "http"
    type: "ClusterIP"
  
  healthChecks:
    enabled: true
    readinessPath: "/readiness"
    livenessPath: "/healthz"
  
  logging:
    accessLog: "/dev/stdout"
    errorLog: "/dev/stderr"
    errorLevel: "warn"
    format: "json"
    
    jsonFormat:
      enabled: true
      fields:
        timestamp: "$time_iso8601"
        level: "info"
        source: "nginx"
        message: "$request"
        request_id: "$http_x_request_id"
        client_ip: "$remote_addr"
        method: "$request_method"
        uri: "$request_uri"
        protocol: "$server_protocol"
        status: "$status"
        response_time: "$request_time"
        bytes_sent: "$body_bytes_sent"
        user_agent: "$http_user_agent"
        referer: "$http_referer"
        x_forwarded_for: "$http_x_forwarded_for"
        upstream_addr: "$upstream_addr"
        upstream_response_time: "$upstream_response_time"
  
  security:
    headers:
      enabled: true
      csp: "default-src 'self'"
      sts: "max-age=31536000; includeSubDomains; preload"
      frameOptions: "DENY"
      contentTypeOptions: "nosniff"
      xssProtection: "1; mode=block"
    authHeaders:
      maxSize: "16k"
      bufferSize: "16k"

# ============================================================================
# File Sharing Configuration with Azure File Storage
# ============================================================================
fileSharing:
  enabled: true
  
  storage:
    pvc:
      enabled: true
      size: "50Gi"
      storageClassName: "azurefile"
      accessMode: "ReadWriteMany"
      volumeName: ""  # Auto-generated
      
      azureFile:
        enabled: true
        shareName: "test-fileshare"
        secretName: nginx-test-fileshare-secret  # Auto-generated from external secrets
        capacity: "50Gi"
        volumeName: ""  # Auto-generated
    
    mountPath: "/opt/app-root/src"
  
  # Multiple location blocks for different directories
  locations:
    # Root directory with auto-indexing
    - path: "/"
      root: "/opt/app-root/src"
      index: "index.html index.htm"
      autoindex: true
      additionalConfig: |
        autoindex_exact_size off;
        autoindex_localtime on;
    
    # Public downloads directory
    - path: "/downloads"
      alias: "/opt/app-root/src/downloads/"
      autoindex: true
      additionalConfig: |
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Content-Disposition "attachment";
    
    # Documents directory (no auto-index, requires knowing filename)
    - path: "/documents"
      alias: "/opt/app-root/src/documents/"
      autoindex: false
      additionalConfig: |
        add_header Cache-Control "no-cache, no-store, must-revalidate";

# ============================================================================
# Elastic Proxy - Disabled for File Sharing Use Case
# ============================================================================
elasticProxy:
  enabled: false

# ============================================================================
# External Secrets - Azure Key Vault
# ============================================================================
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  
  azureKeyVault:
    vaultName: "hki-yuygxqll-dev-kv"  # CHANGE THIS to your Key Vault name
    tenantId: "3feb6bc1-d722-4726-966c-5b58b64df752"  # CHANGE THIS to your tenant ID
    storageAccountNameKey: "AZURE-STORAGE-ACCOUNT-NAME"
    storageAccountKeyKey: "AZURE-STORAGE-ACCOUNT-KEY"
  
  servicePrincipal:
    secretName: "azure-service-principal"

# ============================================================================
# OpenShift Route Configuration
# ============================================================================
route:
  enabled: true
  
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000;includeSubDomains;preload"
    haproxy.router.openshift.io/disable_cookies: "true"
    haproxy.router.openshift.io/timeout: "5m"
  
  host: "files.test.hel.ninja"  # CHANGE THIS to your domain
  
  tls:
    enabled: true
    termination: "edge"
    insecureEdgeTerminationPolicy: "Redirect"

# ============================================================================
# Service Account
# ============================================================================
serviceAccount:
  create: false
  annotations: {}
  name: ""

# ============================================================================
# Pod Annotations
# ============================================================================
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"