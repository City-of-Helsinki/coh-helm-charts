nginx:
  useCase: "front-proxy"
  replicaCount: 2
  image:
    full: 'container-registry.platta-net.hel.fi/devops/nginxinc/nginx-unprivileged:alpine-perl'

frontProxy:
  enabled: true
  
  # --- 1a. PLAIN ENV VARIABLES  ---
  env:
    HOST_PROXY: "https://elasticsearch-test-es-http.nginx-demo.svc.cluster.local:9200"
    HOST_EN: "en.example.com"
    HOST_SV: "sv.example.com"

  # --- 1b. SECRET ENV VARIABLES ---
  secretEnv:
    DIGITRANSIT_API_KEY:
      secretName: "elasticsearch-test-es-elastic-user" 
      secretKey: "elastic"  
    CUSTOM_AUTH_TOKEN:
      secretName: "elasticsearch-test-es-elastic-user"
      secretKey: "elastic"
      
  # --- 2. GLOBAL NGINX CONFIGURATION ---
  globalConfig:
    # Put geo blocks, map blocks and other http-level directives here
    # IPs go directly in httpDirectives - no proxy_ips.conf needed
    httpDirectives: |
      geo $remote_addr $allowed {
        default 0;
        137.163.145.226/32 1;
        129.0.0.0/8 1;
        10.128.0.0/14 1;
        172.30.0.0/16 1;
      }

    serverDirectives:
      - real_ip_header X-Forwarded-For
      - set_real_ip_from 10.128.0.0/14
      - client_max_body_size 100m
      - proxy_buffers 1024 4k

  # --- 3. PRIMARY SERVER BLOCKS (Simple redirects/proxies) ---
  primaryServers:
    - serverName: "en.example.com"
      redirectPath: "/en"
  # --- 4. CUSTOM SERVER BLOCKS (Complex logic/API proxies) ---
  customServers:
    # Option A: use proxyPass for simple proxy without extra directives
    # - serverName: "api.example.com"
    #   locations:
    #     - path: "/"
    #       proxyPass: "https://backend-api:8443"

    # Option B: use additionalConfig when combining proxy_pass with other directives
    - serverName: localhost
      locations:
        - path: "= /"
          additionalConfig: |
            if ($allowed = 0) {
              return 403 "blocked $remote_addr";
            }
            proxy_pass https://elasticsearch-test-es-http.nginx-demo.svc.cluster.local:9200;

observability:
  metrics:
    enabled: true
    type: "stub_status"
    stubStatus:
      path: "/nginx_status"

routes:
  enabled: false  # Disable routes for front-proxy, use ingress instead