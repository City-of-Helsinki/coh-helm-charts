{{- /*
Redis password Secret - owned by this release.

Created when redis.password.existingSecret is NOT set. The password is resolved in
this order, so it never changes between upgrades:

  1. redis.password.password            - explicit value (not recommended in values files)
  2. the Secret this chart already created in the namespace (lookup) - keeps the
     current password on every upgrade
  3. redis.password.migrateFromSecret   - one-time copy of the password from another
     Secret in the namespace (e.g. the old Key Vault / ESO secret), so moving the
     ownership to this chart does not change the password
  4. a random 32 character password     - first install

Consumers (Drupal, drupal-cron, ...) read the password straight from this Secret:
  name: {{ include "redis-sentinel.redis.passwordSecret" . }}
  key:  REDIS_PASSWORD

Note: lookup returns nothing in `helm template` and in a client-side `helm diff`,
so those show a new random value. `helm upgrade --install` against the cluster
keeps the existing password.

helm.sh/resource-policy: keep - the Secret survives `helm uninstall`, so a
re-install of the same release keeps the password the applications already use.
*/}}
{{- if not .Values.redis.password.existingSecret }}
{{- $secretName := include "redis-sentinel.redis.passwordSecret" . }}
{{- $key := include "redis-sentinel.redis.passwordKey" . }}
{{- $password := "" }}
{{- if .Values.redis.password.password }}
{{- $password = .Values.redis.password.password | b64enc }}
{{- else }}
{{- $current := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $current $current.data (hasKey $current.data $key) }}
{{- $password = index $current.data $key }}
{{- else if .Values.redis.password.migrateFromSecret }}
{{- $migrateKey := .Values.redis.password.migrateFromKey | default "REDIS_PASSWORD" }}
{{- $old := lookup "v1" "Secret" .Release.Namespace .Values.redis.password.migrateFromSecret }}
{{- if and $old $old.data (hasKey $old.data $migrateKey) }}
{{- $password = index $old.data $migrateKey }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis-sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-password
  {{- if .Values.redis.password.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{ $key }}: {{ $password | quote }}
{{- end }}
