{{- include "varnish-drupal.validateVcl" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "varnish-drupal.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "varnish-drupal.labels" . | nindent 4 }}
data:

  # ────────────────────────────────────────────────────────────────
  # default.vcl.tmpl  — main VCL entry point (Go template syntax,
  # processed at runtime by kube-httpcache, not by Helm)
  #
  # director.mode "single" (default):
  #   Single be-drupal backend + directors.hash for frontend peers.
  #   Used by most apps.
  #
  # director.mode "multi":
  #   Separate shard director for frontend peers and round_robin
  #   director for backends. Traffic routes via lb.backend().
  #   Used by apps with multiple backend replicas (e.g. palvelukeskus).
  # ────────────────────────────────────────────────────────────────
  default.vcl.tmpl: |
    vcl 4.0;

    import std;
    import directors;

    {{ "{{ range .Frontends }}" }}
    backend {{ "{{ .Name }}" }} {
        .host = "{{ "{{ .Host }}" }}";
        .port = "{{ "{{ .Port }}" }}";
    }
    {{- "{{ end }}" }}

    {{- if eq .Values.vcl.director.mode "multi" }}

    {{ "{{ range .Backends }}" }}
    backend be-{{ "{{ .Name }}" }} {
        .host = "{{ "{{ .Host }}" }}";
        .port = "{{ .Values.backend.port }}";
    }
    {{- "{{ end }}" }}

    sub init_backends {
        new cluster = directors.shard();

        {{ "{{ range .Frontends -}}" }}
        cluster.add_backend({{ "{{ .Name }}" }});
        {{ "{{ end }}" }}

        cluster.set_warmup(180);
        cluster.reconfigure();

        new lb = directors.round_robin();

        {{ "{{ range .Backends -}}" }}
        lb.add_backend(be-{{ "{{ .Name }}" }});
        {{ "{{ end }}" }}
    }

    sub vcl_init {
        call init_backends;
        return (ok);
    }

    sub vcl_recv {
        set req.backend_hint = lb.backend();
    }

    {{- else }}

    backend be-drupal {
        .host = "{{ "{{ .Env.BACKEND_HOST }}" }}";
        .port = "{{ "{{ .Env.BACKEND_PORT }}" }}";
        {{- if .Values.vcl.healthProbe.enabled }}
        .probe = {
            .timeout   = {{ .Values.vcl.healthProbe.timeout }};
            .interval  = {{ .Values.vcl.healthProbe.interval }};
            .window    = {{ .Values.vcl.healthProbe.window }};
            .threshold = {{ .Values.vcl.healthProbe.threshold }};
            .request =
                "GET {{ "{{ .Env.BACKEND_HEALTH_ENDPOINT }}" }} HTTP/1.1"
                "User-Agent: varnish-health"
                "Host: {{ .Values.vcl.healthProbe.host }}"
                "Connection: Close";
        }
        {{- end }}
    }

    sub vcl_init {
        new cluster = directors.hash();

        {{ "{{ range .Frontends -}}" }}
        cluster.add_backend({{ "{{ .Name }}" }}, 1);
        {{ "{{ end }}" }}
    }

    sub vcl_recv {
        set req.backend_hint = be-drupal;
    }

    {{- end }}

      include "/etc/varnish/tmpl/includes-purge.vcl";
      include "/etc/varnish/tmpl/defaults-vcl_recv.vcl";
      include "/etc/varnish/tmpl/drupal.vcl";
      include "/etc/varnish/tmpl/includes-static.vcl";
      include "/etc/varnish/tmpl/defaults-vcl_hash.vcl";
      include "/etc/varnish/tmpl/defaults-vcl_pipe.vcl";
      include "/etc/varnish/tmpl/defaults-vcl_backend_response.vcl";
      include "/etc/varnish/tmpl/defaults-vcl_backend_error.vcl";
      include "/etc/varnish/tmpl/defaults-vcl_deliver.vcl";
      {{- if .Values.vcl.rootRedirect.enabled }}
      include "/etc/varnish/tmpl/defaults-vcl_synth.vcl";
      {{- end }}

  # ────────────────────────────────────────────────────────────────
  # includes-purge.vcl
  # ────────────────────────────────────────────────────────────────
  includes-purge.vcl: |
    import std;

    sub purge_regex {
        ban("obj.http.X-VC-Req-URL ~ " + req.url + " && obj.http.X-VC-Req-Host == " + req.http.host);
    }

    sub purge_exact {
        ban("obj.http.X-VC-Req-URL == " + req.url + " && obj.http.X-VC-Req-Host == " + req.http.host);
    }

    sub purge_page {
        set req.url = regsub(req.url, "\?.*$", "");
        ban("obj.http.X-VC-Req-URL-Base == " + req.url + " && obj.http.X-VC-Req-Host == " + req.http.host);
    }

    # The purge behavior can be controlled with the X-VC-Purge-Method header.
    # Setting the X-VC-Purge-Method header to "regex" or "exact" will use
    # those respective behaviors. Any other value uses the default ("page")
    # behavior. If no X-VC-Purge-Method header is set, the request URL is
    # inspected to make a best guess at the expected purge behavior.

    sub vcl_recv {
        set req.http.X-VC-My-Purge-Key = std.getenv("VARNISH_PURGE_KEY");
        if (req.method == "PURGE" || req.method == "BAN") {
            if (req.http.X-VC-Purge-Key == req.http.X-VC-My-Purge-Key) {
                set req.http.X-VC-Purge-Key-Auth = "true";
            } else {
                set req.http.X-VC-Purge-Key-Auth = "false";
            }
            if (req.http.X-VC-Purge-Key-Auth != "true") {
                return (synth(405, "Not allowed from " + client.ip));
            }

            if (req.method == "BAN" && req.http.Cache-Tags) {
                ban("obj.http.Cache-Tags ~ " + req.http.Cache-Tags);
            }

            if (req.http.X-VC-Purge-Method) {
                if (req.http.X-VC-Purge-Method ~ "(?i)regex") {
                    call purge_regex;
                } elsif (req.http.X-VC-Purge-Method ~ "(?i)exact") {
                    call purge_exact;
                } else {
                    call purge_page;
                }
            } else {
                if (req.url ~ "\.\*" || req.url ~ "^\^" || req.url ~ "\$$" || req.url ~ "\\[.?*+^$|()]") {
                    call purge_regex;
                } elsif (req.url ~ "\?") {
                    call purge_exact;
                } else {
                    call purge_page;
                }
            }
            return (synth(200,"Purged " + req.url + " " + req.http.host));
        }
        unset req.http.X-VC-My-Purge-Key;
        unset req.http.X-VC-Cacheable;
        unset req.http.X-VC-Debug;
    }

  # ────────────────────────────────────────────────────────────────
  # defaults-vcl_recv.vcl
  # ────────────────────────────────────────────────────────────────
  defaults-vcl_recv.vcl: |
    sub vcl_recv {

        {{- if .Values.vcl.healthEndpoint.enabled }}
        if (req.url ~ "/varnishstatus") {
            return (synth(200, "OK"));
        }
        {{- end }}

        {{- if .Values.vcl.rootRedirect.enabled }}
        if (req.url ~ "^/$") {
            return (synth(302, "{{ .Values.vcl.rootRedirect.target }}"));
        }
        {{- end }}

        # Only cache GET and HEAD requests (pass through POST requests).
        if (req.method != "GET" && req.method != "HEAD") {
            set req.http.X-VC-Cacheable = "NO:Request method:" + req.method;
            return(pass);
        }

        # Implementing websocket support.
        if (req.http.Upgrade ~ "(?i)websocket") {
            return (pipe);
        }

        # Do not cache ajax requests.
        if (req.http.X-Requested-With == "XMLHttpRequest") {
            set req.http.X-VC-Cacheable = "NO:Requested with: XMLHttpRequest";
            return(pass);
        }

        # Strip hash, server does not need it.
        if (req.url ~ "\#") {
            set req.url = regsub(req.url, "\#.*$", "");
        }

        # Strip a trailing ? if it exists
        if (req.url ~ "\?$") {
            set req.url = regsub(req.url, "\?$", "");
        }

        if (req.url ~ "(\?|&)(utm_[a-z]+|gclid|cx|ie|cof|siteurl|fbclid)=") {
            set req.url = regsuball(req.url, "&({{ "{{ $params }}" }})=([A-z0-9_\-\.%25]+)", "");
            set req.url = regsuball(req.url, "\?({{ "{{ $params }}" }})=([A-z0-9_\-\.%25]+)", "?");
            set req.url = regsub(req.url, "\?&", "?");
            set req.url = regsub(req.url, "\?$", "");
        }
    }

  # ────────────────────────────────────────────────────────────────
  # drupal.vcl  — Drupal-specific cookie & path handling
  # ────────────────────────────────────────────────────────────────
  drupal.vcl: |
    sub vcl_recv {
        # Do not cache these paths.
        if (req.url ~ "^/status\.php$"  ||
            req.url ~ "^/update\.php"   ||
            req.url ~ "^/install\.php"  ||
            req.url ~ "^/apc\.php$"     ||
            req.url ~ "^/admin"         ||
            req.url ~ "^/admin/.*$"     ||
            req.url ~ "^/user"          ||
            req.url ~ "^/user/.*$"      ||
            req.url ~ "^/users/.*$"     ||
            req.url ~ "^/info/.*$"      ||
            req.url ~ "^/flag/.*$"      ||
            req.url ~ "^.*/ajax/.*$"    ||
            req.url ~ "^.*/ahah/.*$"    ||
            req.url ~ "^/system/files/.*$") {
            return (pass);
        }

        # Always cache the following file types for all users.
        if (req.url ~ "(?i)\.(pdf|asc|dat|txt|doc|xls|ppt|tgz|csv|png|gif|jpeg|jpg|ico|swf|css|js)(\?.*)?$") {
            unset req.http.Cookie;
        }

        # Remove all cookies that Drupal doesn't need to know about.
        if (req.http.Cookie) {
            set req.http.Cookie = ";" + req.http.Cookie;
            set req.http.Cookie = regsuball(req.http.Cookie, "; +", ";");
            set req.http.Cookie = regsuball(req.http.Cookie, ";(SESS[a-z0-9]+|SSESS[a-z0-9]+|NO_CACHE)=", "; \1=");
            set req.http.Cookie = regsuball(req.http.Cookie, ";[^ ][^;]*", "");
            set req.http.Cookie = regsuball(req.http.Cookie, "^[; ]+|[; ]+$", "");

            if (req.http.Cookie == "") {
                unset req.http.Cookie;
            } else {
                return (pass);
            }
        }
    }

  # ────────────────────────────────────────────────────────────────
  # includes-static.vcl
  # ────────────────────────────────────────────────────────────────
  includes-static.vcl: |
    sub vcl_backend_response {
        # Bypass cache for files > 10 MB
        if (std.integer(beresp.http.Content-Length, 0) > 10485760 ) {
            set beresp.uncacheable = true;
            set beresp.ttl = 120s;
            return (deliver);
        }
    }

    sub vcl_recv {
        if (req.url ~ "(?i)\.(asc|doc|xls|ppt|csv|svg|jpg|jpeg|gif|png|ico|css|zip|tgz|gz|rar|bz2|pdf|txt|tar|wav|bmp|rtf|js|flv|swf|html|htm|webp)(\?.*)?$") {
            if (!req.http.Authorization) {
                unset req.http.Cookie;
            }
            return(hash);
        }
    }

    sub vcl_backend_response {
        if (bereq.url ~ "(?i)\.(asc|doc|xls|ppt|csv|svg|jpg|jpeg|gif|png|ico|css|zip|tgz|gz|rar|bz2|pdf|txt|tar|wav|bmp|rtf|js|flv|swf|html|htm|webp)(\?.*)?$") {
            unset beresp.http.set-cookie;
            set beresp.http.X-VC-TTL = 86400;
            set beresp.ttl = std.duration(beresp.http.X-VC-TTL + "s", 0s);
            set beresp.http.X-VC-Cacheable = "YES:Is cacheable, ttl: " + beresp.ttl;
        }
    }

  # ────────────────────────────────────────────────────────────────
  # defaults-vcl_hash.vcl
  # ────────────────────────────────────────────────────────────────
  defaults-vcl_hash.vcl: |
    sub vcl_hash {
        set req.http.hash = req.url;
        if (req.http.host) {
            set req.http.hash = req.http.hash + "#" + req.http.host;
        } else {
            set req.http.hash = req.http.hash + "#" + server.ip;
        }

        if (req.http.X-Forwarded-Proto ~ "https") {
            set req.http.hash = req.http.hash + req.http.X-Forwarded-Proto;
        }

        if (req.http.X-Forwarded-Host) {
            set req.http.hash = req.http.hash + req.http.X-Forwarded-Host;
        }

        if (req.http.vckey) {
            hash_data(req.http.vckey);
            unset req.http.vckey;
        }

        hash_data(req.http.hash);
    }

  # ────────────────────────────────────────────────────────────────
  # defaults-vcl_pipe.vcl
  # ────────────────────────────────────────────────────────────────
  defaults-vcl_pipe.vcl: |
    sub vcl_pipe {
        if (req.http.upgrade) {
            set bereq.http.upgrade = req.http.upgrade;
            set bereq.http.connection = req.http.connection;
        }
        return (pipe);
    }

  # ────────────────────────────────────────────────────────────────
  # defaults-vcl_backend_response.vcl
  # ────────────────────────────────────────────────────────────────
  defaults-vcl_backend_response.vcl: |
    sub vcl_backend_response {
        set beresp.http.X-VC-Req-Host = bereq.http.host;
        set beresp.http.X-VC-Req-URL = bereq.url;
        set beresp.http.X-VC-Req-URL-Base = regsub(bereq.url, "\?.*$", "");

        if (beresp.grace < 2m) {
            set beresp.grace = 2m;
        }

        if (beresp.http.X-VC-TTL) {
            set beresp.ttl = std.duration(beresp.http.X-VC-TTL + "s", 0s);
        }

        if (beresp.http.Set-Cookie) {
            set beresp.ttl = 0s;
        }

        if (bereq.http.X-VC-Cacheable ~ "^NO") {
            set beresp.http.X-VC-Cacheable = bereq.http.X-VC-Cacheable;
            set beresp.uncacheable = true;
            set beresp.ttl = 120s;

        } else if (beresp.ttl <= 0s) {
            if (!beresp.http.X-VC-Cacheable) {
                set beresp.http.X-VC-Cacheable = "NO:Not cacheable, ttl: " + beresp.ttl;
            }
            set beresp.uncacheable = true;
            set beresp.ttl = 120s;

        } else if (beresp.http.Cache-Control ~ "private") {
            set beresp.http.X-VC-Cacheable = "NO:Cache-Control=private";
            set beresp.uncacheable = true;
            set beresp.ttl = 120s;

        } else if (beresp.http.Cache-Control ~ "no-cache") {
            set beresp.http.X-VC-Cacheable = "NO:Cache-Control=no-cache";
            set beresp.uncacheable = true;
            set beresp.ttl = 120s;

        } else if (beresp.http.X-VC-Enabled ~ "true") {
            if (!beresp.http.X-VC-Cacheable) {
                set beresp.http.X-VC-Cacheable = "YES:Is cacheable, ttl: " + beresp.ttl;
            }

        } else if (beresp.http.X-VC-Enabled ~ "false") {
            if (!beresp.http.X-VC-Cacheable) {
                set beresp.http.X-VC-Cacheable = "NO:Disabled";
            }
            set beresp.ttl = 0s;
        }

        if (beresp.status == 404 || beresp.status >= 500) {
            set beresp.ttl = 0s;
            set beresp.grace = 15s;
        }

        set beresp.http.X-Url = bereq.url;
        set beresp.http.X-Host = bereq.http.host;

        if (beresp.http.Surrogate-Control ~ "BigPipe/1.0") {
            set beresp.do_stream = true;
            set beresp.ttl = 0s;
        }

        return(deliver);
    }

  # ────────────────────────────────────────────────────────────────
  # defaults-vcl_backend_error.vcl
  # Set vcl.overrides.backendError in values to replace this entirely
  # with a custom sub vcl_backend_error { ... } block (e.g. multilingual).
  # ────────────────────────────────────────────────────────────────
  defaults-vcl_backend_error.vcl: |
    {{- if .Values.vcl.overrides.backendError }}
    {{ .Values.vcl.overrides.backendError | nindent 4 }}
    {{- else }}
    sub vcl_backend_error {
      set beresp.http.Content-Type = "text/html; charset=utf-8";
      synthetic ({"
    <html>
    <head>
        <title>Not Found</title>
        <style type="text/css">
            A:link    { text-decoration: none; color: #333333; }
            A:visited { text-decoration: none; color: #333333; }
            A:active  { text-decoration: none; }
            A:hover   { text-decoration: underline; }
        </style>
    </head>
    <body onload="setTimeout(function() { window.location.reload() }, 5000)"
          bgcolor=white text=#333333
          style="padding:5px 15px 5px 15px; font-family: myriad-pro-1,myriad-pro-2,corbel,sans-serif;">
        <h3>Page Unavailable</h3>
        <p>The page you requested is temporarily unavailable.</p>
        <h2>Tallensitko juuri sisältöä? Jää tälle sivulle odottamaan uudelleenpäivitystä, muuten sisältösi katoaa!</h2>
        <span>
            <strong>Technical Information</strong><br />
            Error "} + beresp.status + " " + beresp.reason + {"<br />
            XID: "} + bereq.xid + {"<br />
        </span>
    </body>
    </html>
      "});
      return (deliver);
    }
    {{- end }}

  # ────────────────────────────────────────────────────────────────
  # defaults-vcl_deliver.vcl
  # ────────────────────────────────────────────────────────────────
  defaults-vcl_deliver.vcl: |
    sub vcl_deliver {
        unset resp.http.X-VC-Req-Host;
        unset resp.http.X-VC-Req-URL;
        unset resp.http.X-VC-Req-URL-Base;
        unset resp.http.Via;

        unset resp.http.X-Url;
        unset resp.http.X-Host;
        unset resp.http.Cache-Tags;

        if (obj.hits > 0) {
            set resp.http.X-VC-Cache = "HIT";
        } else {
            set resp.http.X-VC-Cache = "MISS";
        }

        if (req.http.X-VC-Debug ~ "true" || resp.http.X-VC-Debug ~ "true") {
            set resp.http.X-VC-Hash = req.http.hash;
            if (req.http.X-VC-DebugMessage) {
                set resp.http.X-VC-DebugMessage = req.http.X-VC-DebugMessage;
            }
        } else {
            unset resp.http.X-VC-Enabled;
            unset resp.http.X-VC-Debug;
            unset resp.http.X-VC-DebugMessage;
            unset resp.http.X-VC-Cacheable;
            unset resp.http.X-VC-Purge-Key-Auth;
            unset resp.http.X-VC-TTL;
        }
    }

  # ────────────────────────────────────────────────────────────────
  # defaults-vcl_synth.vcl  — only rendered when rootRedirect is enabled
  # ────────────────────────────────────────────────────────────────
  {{- if .Values.vcl.rootRedirect.enabled }}
  defaults-vcl_synth.vcl: |
    sub vcl_synth {
      if (resp.status == 302) {
        set resp.http.location = resp.reason;
        set resp.reason = "Moved";
        return (deliver);
      }
    }
  {{- end }}
