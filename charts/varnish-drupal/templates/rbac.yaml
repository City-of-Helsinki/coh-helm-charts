---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "varnish-drupal.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "varnish-drupal.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "varnish-drupal.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "varnish-drupal.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "varnish-drupal.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "varnish-drupal.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}