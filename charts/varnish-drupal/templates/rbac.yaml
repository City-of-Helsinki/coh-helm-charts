---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "varnish-drupal.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "varnish-drupal.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: {{ include "varnish-drupal.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}