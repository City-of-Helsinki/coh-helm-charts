{{- /*
Varnish Secret owned by this release (when externalSecretName is not set).
Each key is taken from, in this order, so values never change on upgrade:
  1. the Secret this chart already created (lookup)
  2. secret.migrateFromSecret - one-time copy, e.g. from the old Key Vault/ESO secret
  3. a new random value
helm template / client-side helm diff cannot lookup and show new random values.
*/}}
{{- if not .Values.externalSecretName }}
{{- $name := include "varnish-drupal.secretName" . }}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $source := dict }}
{{- with .Values.secret.migrateFromSecret }}
{{- $source = (lookup "v1" "Secret" $.Release.Namespace .).data | default dict }}
{{- end }}
{{- $basicAuth := list "Basic_Auth_User" "Basic_Auth_Pass" }}
{{- $keys := list "VARNISH_SECRET" "VARNISH_PURGE_KEY" }}
{{- range $basicAuth }}
{{- if or $.Values.vcl.basicAuth.enabled (hasKey $current .) (hasKey $source .) }}
{{- $keys = append $keys . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "varnish-drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: varnish-secret
  {{- if .Values.secret.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- range $keys }}
  {{- $value := "" }}
  {{- if hasKey $current . }}
  {{- $value = index $current . }}
  {{- else if hasKey $source . }}
  {{- $value = index $source . }}
  {{- else if eq . "Basic_Auth_User" }}
  {{- $value = randAlphaNum 12 | lower | b64enc }}
  {{- else }}
  {{- $value = randAlphaNum 32 | b64enc }}
  {{- end }}
  {{ . }}: {{ $value | quote }}
  {{- end }}
{{- end }}
