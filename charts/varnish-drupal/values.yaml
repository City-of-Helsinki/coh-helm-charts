# ──────────────────────────────────────────────
# Global image settings (overridden per region by the platform pipeline)
# ──────────────────────────────────────────────
global:
  imageRegistry: "image-registry.int.platta.hel.fi"
  imagePullSecrets: []

# ──────────────────────────────────────────────
# Name overrides (optional)
# ──────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

# ──────────────────────────────────────────────
# Routing
# ──────────────────────────────────────────────
route:
  name: "varnish-drupal"
  host: ""                         # e.g. varnish-myapp.apps.platta.hel.fi
  path: ""                         # optional sub-path, leave empty for "/"
  timeout: "300s"                  # haproxy.router.openshift.io/timeout
  labels:                         # Route labels; router: application = Sweden Central sharded router
    router: application
# ──────────────────────────────────────────────
# Service
# ──────────────────────────────────────────────
service:
  name: "varnish"           # overrides the main service name only
  headlessName: "varnish-headless"   # overrides the headless service name only

serviceAccountName: kube-httpcache-sa
# ──────────────────────────────────────────────
# Varnish image
# ──────────────────────────────────────────────
# Tag is managed centrally in pipeline-templates/common/helm-values/images/varnish-drupal.yaml
image:
  registry: ""                     # empty = global.imageRegistry
  repository: hki-platta-components/kube-httpcache-fork
  tag: stable-6.0
  digest: ""                       # optional sha256:...; wins over tag
  pullPolicy: Always

# ──────────────────────────────────────────────
# Image pull secrets (for private registries)
# ──────────────────────────────────────────────
imagePullSecrets: []
# - name: my-registry-secret

# ──────────────────────────────────────────────
# Scaling & scheduling
# ──────────────────────────────────────────────
replicaCount: 2
revisionHistoryLimit: 3

# ──────────────────────────────────────────────
# Pod scheduling (same keys in every coh chart). Empty = any worker node.
# Empty values fall back to global.nodeSelector / global.tolerations / global.affinity.
# ──────────────────────────────────────────────
nodeSelector: {}          # e.g. {environment: test}
tolerations: []           # e.g. [{key: dedicated, operator: Equal, value: web, effect: NoSchedule}]
affinity: {}              # Kubernetes affinity (nodeAffinity / podAffinity / podAntiAffinity)
# Built-in soft anti-affinity (preferredDuringScheduling) that spreads the Varnish
# replicas over different nodes; used only when affinity (and global.affinity) is empty.
podAntiAffinity:
  enabled: true
nodeSelectorKey: env      # legacy: label key when nodeSelector is a plain string (e.g. "prod")

# ──────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────
resources:
  varnish:
    requests:
      cpu: "200m"
      memory: "1Gi"
    limits:
      cpu: ""                      # leave empty to omit (avoids CPU throttling); set e.g. "1000m" if your cluster requires a limit
      memory: "1Gi"
  logger:
    requests:
      cpu: "50m"
      memory: "50Mi"
    limits:
      cpu: ""                      # leave empty to omit
      memory: "50Mi"

# ──────────────────────────────────────────────
# Backend (Drupal service)
# ──────────────────────────────────────────────
backend:
  host: "drupal"
  port: "8080"

# ──────────────────────────────────────────────
# Secrets
# ──────────────────────────────────────────────
# Default: the chart owns the Secret (<fullname>-secret, or secret.name) with VARNISH_SECRET and
# VARNISH_PURGE_KEY (+ Basic_Auth_User / Basic_Auth_Pass when vcl.basicAuth.enabled).
# Values are generated once and kept on upgrades. Drupal reads the Secret with envFrom.
secret:
  name: ""                         # empty = <fullname>-secret
  migrateFromSecret: ""            # one-time copy of the keys from this Secret (e.g. the old Key Vault/ESO secret)
  keepOnUninstall: true            # helm.sh/resource-policy: keep

# Legacy: a Secret managed outside the chart (e.g. Key Vault/ESO). When set, the chart creates no Secret.
externalSecretName: ""

# ──────────────────────────────────────────────
# Varnish storage
# ──────────────────────────────────────────────
varnishStorage: "malloc,512M"
varnishTransientStorage: "malloc,128M"

# ──────────────────────────────────────────────
# VCL feature flags
# ──────────────────────────────────────────────
vcl:

  # ── Require basic authentication ─────────────────────────────── 
  # Uses Basic_Auth_User and Basic_Auth_Pass secrets from externalSecret
  basicAuth:
    enabled: false

  # ── Director / load balancing topology ─────────────────────────
  director:
    # "single" (default): one be-drupal backend + directors.hash for
    #   frontend peer discovery. Used by most apps.
    # "multi": separate directors.shard (frontends) + directors.round_robin
    #   (backends). Traffic routes via lb.backend(). Used by apps with
    #   multiple Drupal backend replicas (e.g. palvelukeskus).
    mode: "single"

  # ── /varnishstatus health endpoint in vcl_recv ─────────────────
  healthEndpoint:
    enabled: true

  # ── Backend health probe in default.vcl.tmpl ───────────────────
  # Only applies when director.mode is "single".
  healthProbe:
    enabled: true
    endpoint: "/health"
    host: "www.hel.fi"
    timeout: "5s"
    interval: "5s"
    window: 5
    threshold: 3

  # ── Root redirect: return 302 for "/" ──────────────────────────
  # Also enables defaults-vcl_synth.vcl (required for 302 delivery).
  rootRedirect:
    enabled: false
    target: ""                     # e.g. "https://myapp.hel.fi/fi"

  # ── Raw VCL overrides ──────────────────────────────────────────
  # Replaces the named VCL file entirely when non-empty.
  # Paste the full sub vcl_<hook> { ... } block as a multiline string.
  #
  # Example — multilingual error page:
  #   overrides:
  #     backendError: |
  #       sub vcl_backend_error {
  #         set beresp.http.Content-Type = "text/html; charset=utf-8";
  #         if (bereq.url ~ "^/fi/") {
  #           synthetic ({"<html>..Finnish..</html>"});
  #         } else if (bereq.url ~ "^/en/") {
  #           synthetic ({"<html>..English..</html>"});
  #         } else {
  #           synthetic ({"<html>..fallback..</html>"});
  #         }
  #         return (deliver);
  #       }
  overrides:
    # Replace drupal.vcl entirely — paste a full sub vcl_recv { ... } block.
    # Use when an app needs custom path/cookie logic beyond the standard Drupal rules.
    # Example — cache only images, pass everything else:
    #   drupal: |
    #     sub vcl_recv {
    #         if (req.url ~ "(?i)^(?!.*\.(png|gif|jpeg|jpg)(\?.*)?$).*$") { return (pass); }
    #     }
    drupal: ""

    # Replace defaults-vcl_backend_error.vcl entirely.
    backendError: ""