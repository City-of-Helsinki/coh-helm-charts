{{- /*
Stores the default index templates (bodies in the ConfigMap <fullname>-index-defaults) after
every install and upgrade. PUT is idempotent, so each run also resets manual edits.

Credentials: the technical user platta-defaults (Secret <fullname>-platta-defaults, written by
External Secrets). Until the Secret exists the pod waits (CreateContainerConfigError, retried
by the kubelet); until Elasticsearch is up and ECK has loaded the user, the script retries.
Helm waits for this Job, so the helm --timeout must cover a fresh install (README: 15m).

TLS: trusts the OpenShift service CA from the ConfigMap platta-service-ca (no -k).
*/}}
{{- $v := .Values }}
{{- $g := $v.global | default dict }}
{{- $host := printf "%s.%s.svc" (include "elasticsearch.httpServiceName" .) .Release.Namespace }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elasticsearch.indexDefaultsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
    app.kubernetes.io/component: index-defaults
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # a failed Job stays for debugging until the next install/upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  # Elasticsearch start + user propagation on a fresh 3-node install (~5 min), with margin
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "elasticsearch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: index-defaults
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with include "elasticsearch.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with ($v.nodeSelector | default $g.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($v.tolerations | default $g.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: index-defaults
          # the Elasticsearch image the chart already runs (has curl and bash)
          image: {{ include "elasticsearch.image" . }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              umask 077
              # credentials in a netrc file, never on the command line
              printf 'machine %s login %s password %s\n' "$ES_HOST" "$ES_USERNAME" "$ES_PASSWORD" > /tmp/netrc
              # es METHOD PATH [curl args]: prints the HTTP status, body in /tmp/response
              es() {
                local method="$1" path="$2"; shift 2
                curl -sS -o /tmp/response -w '%{http_code}' \
                  --cacert /etc/platta-service-ca/service-ca.crt --netrc-file /tmp/netrc \
                  --connect-timeout 5 --max-time 30 \
                  -X "$method" "$@" "https://$ES_HOST:9200/$path"
              }
              put() {
                local path="$1" body="$2" code
                while true; do
                  code=$(es PUT "$path" -H 'Content-Type: application/json' --data-binary "@$body") || code=000
                  case "$code" in
                    200)
                      echo "PUT $path: OK"
                      return 0 ;;
                    400)
                      echo "PUT $path: rejected by Elasticsearch (HTTP 400):"
                      cat /tmp/response; echo
                      if grep -q 'same priority' /tmp/response; then
                        # Elasticsearch names them: "... matching patterns from existing templates [a,b] ..."
                        local conflicts
                        conflicts=$(grep -o 'existing templates \[[^]]*\]' /tmp/response | head -n 1 \
                          | sed -e 's/^existing templates \[//' -e 's/\]$//' || true)
                        echo "ERROR: $path overlaps existing index templates with the same priority:"
                        echo "  ${conflicts:-(see the response above)}"
                        echo "If one of them is your own, set \"priority\": 1 or higher in it (and add"
                        echo "\"composed_of\": [\"platta-defaults\"]), then run the helm upgrade again."
                        echo "If none of them is yours, report this to Platta."
                      fi
                      return 1 ;;
                    *)
                      echo "PUT $path: HTTP $code (Elasticsearch not ready or user not loaded yet), retrying in 10s"
                      sleep 10 ;;
                  esac
                done
              }
              # with no users there is no index template; delete a stale one (404 is fine)
              del() {
                local path="$1" code
                while true; do
                  code=$(es DELETE "$path") || code=000
                  case "$code" in
                    200)
                      echo "DELETE $path: OK"
                      return 0 ;;
                    404)
                      echo "DELETE $path: not found, nothing to delete"
                      return 0 ;;
                    400)
                      echo "DELETE $path: rejected by Elasticsearch (HTTP 400):"
                      cat /tmp/response; echo
                      return 1 ;;
                    *)
                      echo "DELETE $path: HTTP $code (Elasticsearch not ready or user not loaded yet), retrying in 10s"
                      sleep 10 ;;
                  esac
                done
              }
              put _component_template/{{ include "elasticsearch.defaultsComponentTemplate" . }} /etc/index-defaults/component-template.json
              {{- if include "elasticsearch.defaultIndexPatterns" . | fromJsonArray }}
              put _index_template/{{ include "elasticsearch.defaultsIndexTemplate" . }} /etc/index-defaults/index-template.json
              {{- else }}
              del _index_template/{{ include "elasticsearch.defaultsIndexTemplate" . }}
              {{- end }}
          env:
            - name: ES_HOST
              value: {{ $host }}
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "elasticsearch.defaultsUserSecretName" . }}
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "elasticsearch.defaultsUserSecretName" . }}
                  key: password
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: service-ca
              mountPath: /etc/platta-service-ca
              readOnly: true
            - name: templates
              mountPath: /etc/index-defaults
              readOnly: true
      volumes:
        - name: service-ca
          configMap:
            name: platta-service-ca
            items:
              - key: service-ca.crt
                path: service-ca.crt
        - name: templates
          configMap:
            name: {{ include "elasticsearch.indexDefaultsName" . }}
