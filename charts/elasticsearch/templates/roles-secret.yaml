{{- /*
roles.yml for ECK (spec.auth.roles): one role elasticsearch-user-<name> per user, limited to its
indices. Helm-managed: no password here. Changing indices or role (search/write) updates only
this Secret, never a password.
*/}}
{{- $users := include "elasticsearch.users" . | fromJsonArray }}
{{- if $users }}
{{- $roles := dict }}
{{- range $users }}
{{- $_ := set $roles (include "elasticsearch.userRoleName" .) (dict
      "cluster" (list "monitor")
      "indices" (list (dict
        "names" .indices
        "privileges" (include "elasticsearch.indexPrivileges" .role | fromJsonArray)))) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elasticsearch.rolesSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
type: Opaque
stringData:
  roles.yml: |
    {{- toYaml $roles | nindent 4 }}
{{- end }}
