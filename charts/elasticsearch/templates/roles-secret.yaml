{{- /*
roles.yml for ECK (spec.auth.roles): one role elasticsearch-user-<name> per team user, limited to
its indices, plus the technical user's role (cluster manage_index_templates only). Always
rendered, because the technical user always exists. Helm-managed: no password here. Changing
indices or role (search/write) updates only this Secret, never a password.
*/}}
{{- $roles := dict }}
{{- range (include "elasticsearch.realmUsers" . | fromJsonArray) }}
{{- $_ := set $roles .roleName .role }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elasticsearch.rolesSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
type: Opaque
stringData:
  roles.yml: |
    {{- toYaml $roles | nindent 4 }}
