{{- /*
Per user: a Password generator and an ExternalSecret that writes the user Secret
elasticsearch-user-<name> (kubernetes.io/basic-auth: username, password, roles), the format
ECK's file realm reads. External Secrets generates the password when the ExternalSecret is
created and again only when the ExternalSecret itself changes (refreshPolicy OnChange); it
never passes through Helm. To change it:
  oc annotate externalsecret elasticsearch-user-<name> force-sync=$(date +%s) --overwrite
*/}}
{{- range (include "elasticsearch.users" . | fromJsonArray) }}
{{- $name := include "elasticsearch.userSecretName" .name }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "elasticsearch.userLabels" $ | nindent 4 }}
spec:
  length: 32
  digits: 8
  # alphanumeric only: safe in URLs, environment variables and Basic auth headers
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "elasticsearch.userLabels" $ | nindent 4 }}
spec:
  # Sync (= generate a new password) only when this object's spec, labels or annotations
  # change: that is how force-sync rotates the password. With the default policy (Periodic)
  # and refreshInterval "0", ESO never refreshes and ignores force-sync (verified on dev-se,
  # ESO 1.2.1). Everything here is kept stable so that normal upgrades change nothing.
  refreshPolicy: OnChange
  refreshInterval: "0"
  target:
    name: {{ $name }}
    # The Secret belongs to the ExternalSecret: removing the user deletes it
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      metadata:
        labels:
          {{- include "elasticsearch.userLabels" $ | nindent 10 }}
      data:
        username: {{ .name | quote }}
        password: {{ "{{ .password }}" | quote }}
        roles: {{ include "elasticsearch.userRoleName" . | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}
{{- end }}
