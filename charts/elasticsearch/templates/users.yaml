{{- /*
Per user: a Password generator and an ExternalSecret that writes the user Secret
elasticsearch-user-<name> (kubernetes.io/basic-auth: username, password, roles), the format
ECK's file realm reads. The password is generated by External Secrets once
(refreshInterval "0") and never passes through Helm. To change it:
  oc annotate externalsecret elasticsearch-user-<name> force-sync=$(date +%s) --overwrite
*/}}
{{- range (include "elasticsearch.users" . | fromJsonArray) }}
{{- $name := include "elasticsearch.userSecretName" .name }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "elasticsearch.userLabels" $ | nindent 4 }}
spec:
  length: 32
  digits: 8
  # alphanumeric only: safe in URLs, environment variables and Basic auth headers
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "elasticsearch.userLabels" $ | nindent 4 }}
spec:
  # Generate once. A change of this object's spec, labels or annotations generates a new
  # password (that is how force-sync works), so keep everything here stable.
  refreshInterval: "0"
  target:
    name: {{ $name }}
    # The Secret belongs to the ExternalSecret: removing the user deletes it
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      metadata:
        labels:
          {{- include "elasticsearch.userLabels" $ | nindent 10 }}
      data:
        username: {{ .name | quote }}
        password: {{ "{{ .password }}" | quote }}
        roles: {{ include "elasticsearch.userRoleName" . | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}
{{- end }}
