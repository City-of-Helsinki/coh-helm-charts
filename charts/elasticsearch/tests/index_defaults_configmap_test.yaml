suite: default index replicas (template bodies)
templates:
  - index-defaults-configmap.yaml

tests:
  - it: should always render the ConfigMap <fullname>-index-defaults
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-elasticsearch-index-defaults

  - it: should set only index.auto_expand_replicas "0-1" in the component template platta-defaults
    asserts:
      - equal:
          path: data["component-template.json"]
          value: |
            {
              "_meta": {
                "description": "Platta default replicas: 0 on 1 node, 1 on 3 nodes. Add to your own index templates with composed_of.",
                "managed_by": "coh-helm-charts/elasticsearch"
              },
              "template": {
                "settings": {
                  "index": {
                    "auto_expand_replicas": "0-1"
                  }
                }
              }
            }

  - it: should match the users' index patterns with priority 0 and compose platta-defaults in the index template
    set:
      users:
        - name: myapp-indexer
          role: write
          indices: ["myapp-*"]
    asserts:
      - equal:
          path: data["index-template.json"]
          value: |
            {
              "_meta": {
                "description": "Applies platta-defaults to the index patterns of the chart's users that no other index template matches. Own templates need priority 1 or higher.",
                "managed_by": "coh-helm-charts/elasticsearch"
              },
              "composed_of": [
                "platta-defaults"
              ],
              "index_patterns": [
                "myapp-*"
              ],
              "priority": 0
            }

  - it: should use the union of all users' patterns (search and write), deduplicated and sorted
    set:
      users:
        - name: myapp-indexer
          role: write
          indices: ["myapp-*", "shared-*"]
        - name: myapp-search
          role: search
          indices: ["myapp-*"]
        - name: other-indexer
          role: write
          indices: ["shared-*", "audit-2026", "myapp-*"]
    asserts:
      - matchRegex:
          path: data["index-template.json"]
          pattern: '"index_patterns": \[\s*"audit-2026",\s*"myapp-\*",\s*"shared-\*"\s*\]'

  - it: should follow a change of a user's indices
    set:
      users:
        - name: myapp-indexer
          role: write
          indices: ["myapp-v2-*"]
    asserts:
      - matchRegex:
          path: data["index-template.json"]
          pattern: '"index_patterns": \[\s*"myapp-v2-\*"\s*\]'
      - notMatchRegex:
          path: data["index-template.json"]
          pattern: '"myapp-\*"'

  - it: should never add patterns for the technical user, and never "*" or dot-patterns
    set:
      users:
        - name: myapp-indexer
          role: write
          indices: ["myapp-*"]
    asserts:
      - notMatchRegex:
          path: data["index-template.json"]
          pattern: '"index_patterns": \[[^\]]*"(\*|\.[^"]*|platta-[^"]*)"'

  - it: should render no index template body without users (the Job deletes the template)
    asserts:
      - notExists:
          path: data["index-template.json"]
      - exists:
          path: data["component-template.json"]

  - it: should render the same bodies for 3 nodes (auto_expand adjusts in Elasticsearch, not in the chart)
    set:
      nodeCount: 3
    asserts:
      - matchRegex:
          path: data["component-template.json"]
          pattern: '"auto_expand_replicas": "0-1"'
