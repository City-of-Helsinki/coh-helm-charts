name: Release workflow for nginx-standard Helm Chart

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'The semantic version to release (e.g., 1.0.1). Will override existing releases.'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        use-case:
          - file-sharing
          - elastic-proxy
          - cache
          - front-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install test dependencies
        run: |
          # Install kubeconform for OpenShift manifest validation
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
          
          # Install yq for YAML processing
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          
          # Install helm-unittest plugin
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 0.2.11 --verify=false

      - name: Lint chart
        run: |
          helm lint charts/nginx-standard/

      - name: Run unit tests
        run: |
          helm unittest charts/nginx-standard/

      - name: Test ${{ matrix.use-case }} template rendering
        run: |
          echo "Testing ${{ matrix.use-case }} use case..."
          helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
            -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
            --debug

      - name: Validate ${{ matrix.use-case }} OpenShift manifests
        run: |
          echo "Validating ${{ matrix.use-case }} manifests against OpenShift schemas..."
          # Use kubeconform with ignore-missing-schemas for OpenShift-specific resources
          # like Route, SecurityContextConstraints, etc.
          helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
            -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -

      - name: Test ${{ matrix.use-case }} with custom overrides
        run: |
          echo "Testing ${{ matrix.use-case }} with various configurations..."
          
          # Test with autoscaling enabled
          helm template test-${{ matrix.use-case }}-hpa charts/nginx-standard/ \
            -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=2 \
            --set autoscaling.maxReplicas=10 \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -
          
          # Test with metrics enabled
          helm template test-${{ matrix.use-case }}-metrics charts/nginx-standard/ \
            -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
            --set observability.metrics.enabled=true \
            --set observability.serviceMonitor.enabled=true \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -
          
          # Test with network policies
          helm template test-${{ matrix.use-case }}-netpol charts/nginx-standard/ \
            -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
            --set networkPolicy.enabled=true \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -
          
          # Test with OpenShift Routes enabled
          helm template test-${{ matrix.use-case }}-route charts/nginx-standard/ \
            -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
            --set routes.enabled=true \
            --set routes.items[0].host=test-${{ matrix.use-case }}.apps.example.com \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -

      - name: Verify NGINX configuration syntax for ${{ matrix.use-case }}
        run: |
          echo "Extracting and validating NGINX configuration..."
          
          # Extract nginx.conf from ConfigMap
          helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
            -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
            | yq eval 'select(.kind == "ConfigMap") | .data."nginx.conf"' - > /tmp/nginx.conf
          
          # Extract server.conf from ConfigMap
          helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
            -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
            | yq eval 'select(.kind == "ConfigMap") | .data."server.conf"' - > /tmp/server.conf
          
          echo "=== Generated nginx.conf ==="
          cat /tmp/nginx.conf
          echo ""
          echo "=== Generated server.conf ==="
          cat /tmp/server.conf
          
          # Basic syntax validation (check for unclosed blocks)
          if ! grep -q "events {" /tmp/nginx.conf; then
            echo "ERROR: Missing events block in nginx.conf"
            exit 1
          fi
          
          if ! grep -q "http {" /tmp/nginx.conf; then
            echo "ERROR: Missing http block in nginx.conf"
            exit 1
          fi
          
          # Count opening and closing braces
          OPEN_BRACES=$(grep -o "{" /tmp/nginx.conf | wc -l)
          CLOSE_BRACES=$(grep -o "}" /tmp/nginx.conf | wc -l)
          
          if [ "$OPEN_BRACES" -ne "$CLOSE_BRACES" ]; then
            echo "ERROR: Unbalanced braces in nginx.conf (open: $OPEN_BRACES, close: $CLOSE_BRACES)"
            exit 1
          fi
          
          echo "✓ NGINX configuration syntax appears valid"

      - name: Test use-case specific validations for ${{ matrix.use-case }}
        run: |
          case "${{ matrix.use-case }}" in
            file-sharing)
              echo "Validating file-sharing specific resources..."
              # Check PVC is created
              helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
                -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
                | yq eval 'select(.kind == "PersistentVolumeClaim")' - > /tmp/pvc.yaml
              
              if [ ! -s /tmp/pvc.yaml ]; then
                echo "ERROR: PVC not generated for file-sharing mode"
                exit 1
              fi
              
              # Check External Secrets if static mode
              MODE=$(yq eval '.fileSharing.storage.mode' charts/nginx-standard/values-${{ matrix.use-case }}.yaml)
              if [ "$MODE" = "static" ]; then
                helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
                  -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
                  | yq eval 'select(.kind == "ExternalSecret")' - > /tmp/externalsecret.yaml
                
                if [ ! -s /tmp/externalsecret.yaml ]; then
                  echo "ERROR: ExternalSecret not generated for static file-sharing mode"
                  exit 1
                fi
              fi
              ;;
              
            elastic-proxy)
              echo "Validating elastic-proxy specific configuration..."
              # Check for Elasticsearch environment variables
              helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
                -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
                | yq eval 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "ELASTICSEARCH_URL")' - > /tmp/es-env.yaml
              
              if [ ! -s /tmp/es-env.yaml ]; then
                echo "ERROR: ELASTICSEARCH_URL not set for elastic-proxy"
                exit 1
              fi
              
              # Verify perl module is loaded in nginx.conf
              helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
                -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
                | yq eval 'select(.kind == "ConfigMap") | .data."nginx.conf"' - | grep -q "ngx_http_perl_module"
              
              if [ $? -ne 0 ]; then
                echo "ERROR: Perl module not loaded for elastic-proxy"
                exit 1
              fi
              ;;
              
            cache)
              echo "Validating cache specific configuration..."
              # Check cache volume is created
              helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
                -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
                | yq eval 'select(.kind == "Deployment") | .spec.template.spec.volumes[] | select(.name == "cache-volume")' - > /tmp/cache-vol.yaml
              
              if [ ! -s /tmp/cache-vol.yaml ]; then
                echo "ERROR: Cache volume not created"
                exit 1
              fi
              
              # Verify proxy_cache_path in nginx.conf
              helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
                -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
                | yq eval 'select(.kind == "ConfigMap") | .data."nginx.conf"' - | grep -q "proxy_cache_path"
              
              if [ $? -ne 0 ]; then
                echo "ERROR: proxy_cache_path not configured"
                exit 1
              fi
              ;;
              
            front-proxy)
              echo "Validating front-proxy specific configuration..."
              # Check environment variables are set
              helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
                -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
                | yq eval 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "HOST_PROXY")' - > /tmp/host-proxy-env.yaml
              
              if [ ! -s /tmp/host-proxy-env.yaml ]; then
                echo "ERROR: HOST_PROXY not set for front-proxy"
                exit 1
              fi
              
              # Verify perl module is loaded
              helm template test-${{ matrix.use-case }} charts/nginx-standard/ \
                -f charts/nginx-standard/values-${{ matrix.use-case }}.yaml \
                | yq eval 'select(.kind == "ConfigMap") | .data."nginx.conf"' - | grep -q "ngx_http_perl_module"
              
              if [ $? -ne 0 ]; then
                echo "ERROR: Perl module not loaded for front-proxy"
                exit 1
              fi
              ;;
          esac
          
          echo "✓ Use-case specific validations passed"

  integration-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OpenShift CLI
        run: |
          wget https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar xvf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/
          oc version --client

      - name: Login to OpenShift Dev Cluster
        run: |
          echo "${{ secrets.OPENSHIFT_TOKEN }}" | oc login ${{ secrets.OPENSHIFT_API_URL }} --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Set namespace context
        run: |
          oc project nginx-demo || oc new-project nginx-demo
          echo "Using namespace: nginx-demo"

      - name: Clean up previous test deployments
        run: |
          echo "Cleaning up any existing test deployments..."
          helm list -n nginx-demo | grep '^test-' | awk '{print $1}' | xargs -r helm uninstall -n nginx-demo || true
          
          # Wait for cleanup
          sleep 10

      - name: Test file-sharing deployment
        run: |
          echo "Testing file-sharing use case..."
          
          # Install chart (with PVC disabled for testing, use emptyDir)
          helm install test-file-sharing charts/nginx-standard/ \
            -n nginx-demo \
            --set nginx.useCase=file-sharing \
            --set fileSharing.enabled=true \
            --set fileSharing.storage.pvc.enabled=false \
            --set externalSecrets.enabled=false \
            --set routes.enabled=false \
            --wait --timeout 3m
          
          # Verify deployment
          oc rollout status deployment/test-file-sharing-nginx-standard -n nginx-demo --timeout=3m
          
          # Test health endpoints
          POD_NAME=$(oc get pods -n nginx-demo -l "app.kubernetes.io/name=nginx-standard,app.kubernetes.io/instance=test-file-sharing" -o jsonpath="{.items[0].metadata.name}")
          echo "Testing pod: $POD_NAME"
          
          oc exec -n nginx-demo $POD_NAME -- curl -f http://localhost:8080/readiness || exit 1
          oc exec -n nginx-demo $POD_NAME -- curl -f http://localhost:8080/healthz || exit 1
          
          echo "✓ file-sharing deployed and healthy"

