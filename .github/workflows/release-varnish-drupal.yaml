  release:
    needs: [test] # , integration-test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to see git history and tags for changelog

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the latest tag, if none exist, default to empty
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "CHANGELOG=Initial release of varnish-drupal." >> $GITHUB_OUTPUT
          else
            # Get commit messages between previous tag and now
            LOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s")
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "$LOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          
      - name: Get chart name
        id: chart
        run: |
          CHART_NAME=$(yq eval '.name' charts/varnish-drupal/Chart.yaml)
          echo "chart_name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "Chart: $CHART_NAME"

      - name: Determine Chart Version and Git Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/varnish-drupal-v* ]]; then
            CHART_VERSION=${GITHUB_REF#refs/tags/varnish-drupal-}
            GIT_TAG=${GITHUB_REF#refs/tags/}
          elif [ -n "${{ github.event.inputs.chart_version }}" ]; then
            INPUT_VERSION="${{ github.event.inputs.chart_version }}"
            CLEAN_VERSION="${INPUT_VERSION#v}"
            CHART_VERSION="v${CLEAN_VERSION}"
            GIT_TAG="varnish-drupal-${CHART_VERSION}"
          else
            echo "Error: Chart version could not be determined"
            exit 1
          fi

          echo "chart_version=$CHART_VERSION" >> $GITHUB_OUTPUT
          echo "git_tag=$GIT_TAG"             >> $GITHUB_OUTPUT
          echo "Chart Version : $CHART_VERSION"
          echo "Git Tag       : $GIT_TAG"

      - name: Update Chart Version
        run: |
          sed -i "s/^version: .*/version: ${{ inputs.chart_version }}/" charts/varnish-drupal/Chart.yaml

      - name: Package Chart
        run: helm package charts/varnish-drupal

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Publish to Helm Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository_owner }}/coh-helm-repo.git artifacts-repo
          cd artifacts-repo
          git fetch origin
          git checkout gh-pages || git checkout -b gh-pages
          mkdir -p ${{ steps.chart.outputs.chart_name }}
          cp ../*.tgz ${{ steps.chart.outputs.chart_name }}/
          helm repo index . --url https://${{ github.repository_owner }}.github.io/coh-helm-repo --merge index.yaml
          git add .
          git commit -m "feat: Release ${{ steps.chart.outputs.chart_name }} ${{ steps.version.outputs.chart_version }}" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository_owner }}/coh-helm-repo.git gh-pages

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "varnish-drupal-*.tgz"
          tag: ${{ steps.version.outputs.git_tag }}
          name: "varnish-drupal ${{ inputs.chart_version }}"
          body: |
            ## Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}