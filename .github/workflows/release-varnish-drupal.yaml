name: Release workflow for varnish-drupal Helm Chart

on:
  pull_request:
    branches: [ main ]
    # Only run this workflow if the varnish-drupal chart changes
    paths:
      - 'charts/varnish-drupal/**'
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'New chart version (e.g., 1.0.1)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.20.2'

      - name: Install test dependencies
        run: |
          # Install kubeconform for manifest validation
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

          # Install helm-unittest plugin
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.4.1

      - name: Lint and Validate
        run: |
          # Validate Helm chart structure
          helm lint charts/varnish-drupal
          
          # Run unit tests
          if [ -d "charts/varnish-drupal/tests" ]; then helm unittest charts/varnish-drupal; fi

          # Validate rendered manifests
          helm template charts/varnish-drupal | kubeconform -summary -skip Route

