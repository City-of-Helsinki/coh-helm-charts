name: Release workflow for mailpit-openshift Helm Chart

on:
  pull_request:
    branches: [ main ]
    # Only run this workflow if the mailpit-openshift chart changes
    paths:
      - 'charts/mailpit-openshift/**'
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'New chart version (e.g., 0.1.1)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.20.2'

      - name: Install test dependencies
        run: |
          # Install kubeconform for manifest validation
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

          # Install helm-unittest plugin
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.4.1

      - name: Build Chart Dependencies
        run: |
          # mailpit-openshift depends on the jouve/mailpit subchart, which must be fetched to lint/template
          helm dependency build charts/mailpit-openshift

      - name: Lint and Validate
        run: |
          # Validate Helm chart structure
          helm lint charts/mailpit-openshift
          
          # Run unit tests if the directory exists
          if [ -d "charts/mailpit-openshift/tests" ]; then helm unittest charts/mailpit-openshift; fi

          # Validate rendered manifests (skipping custom OpenShift Route & ExternalSecret CRDs)
          helm template charts/mailpit-openshift | kubeconform -summary -skip Route,ExternalSecret

  integration-test:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-mailpit-openshift
      cancel-in-progress: false
    env:
      # Shared CI namespace + route domain on the Sweden Central CI cluster
      NS: ${{ vars.CI_NAMESPACE || 'platta-components-helm-ci' }}
      CI_DOMAIN: ${{ vars.CI_ROUTE_DOMAIN || 'test-se.hel.ninja' }}
      RELEASE: ci-mailpit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.20.2'

      - name: Install OpenShift CLI
        run: |
          wget https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar xvf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/
          oc version --client

      - name: Login to OpenShift Dev Cluster
        env:
          # Repository variable (not secret): API URL of the CI cluster (Sweden Central)
          OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
          # Repository secret: service-account token for that cluster
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          : "${OPENSHIFT_SERVER:?Repository variable OPENSHIFT_SERVER is not set}"
          : "${OPENSHIFT_TOKEN:?Repository secret OPENSHIFT_TOKEN is not set}"
          oc login "${OPENSHIFT_SERVER}" --token="${OPENSHIFT_TOKEN}" --insecure-skip-tls-verify
          echo "Logged in to $(oc whoami --show-server) as $(oc whoami)"

      - name: Prepare CI namespace (access check + test fixtures)
        run: .github/scripts/ci-prepare-namespace.sh "$NS"

      - name: Clean up previous test deployments (leftovers from earlier runs)
        run: .github/scripts/ci-cleanup.sh "$NS" "^${RELEASE}$"

      - name: Build Chart Dependencies
        run: |
          helm dependency build charts/mailpit-openshift

      - name: Deploy to Test Namespace
        run: |
          # Deploying with an existingSecret override for integration verification purposes
          helm upgrade --install $RELEASE charts/mailpit-openshift \
            --namespace $NS \
            --set route.host="mailpit-sample-test1.${CI_DOMAIN}" \
            --set existingSecret="mailpit-ui-auth" \
            --wait

      - name: Verify Mailpit UI Status
        run: |
          DEPLOYMENT_NAME=$(oc get deployment -n $NS -l "app.kubernetes.io/name=mailpit,app.kubernetes.io/instance=$RELEASE" -o jsonpath='{.items[0].metadata.name}')
          echo "Discovered deployment name: $DEPLOYMENT_NAME"
          oc rollout status deployment/$DEPLOYMENT_NAME -n $NS

          # Verification check against the UI endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mailpit-sample-test1.${CI_DOMAIN}/readyz)
          echo "Status Code: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "Verification failed! Expected 200 but got $STATUS"
            # Gather logs from the mailpit container for debugging
            oc logs deployment/$DEPLOYMENT_NAME -c mailpit -n $NS --tail=50
            exit 1
          fi

      - name: Cleanup (all objects)
        if: always()
        run: .github/scripts/ci-cleanup.sh "$NS" "^${RELEASE}$"


  release:
    needs: [test, integration-test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to see git history and tags for changelog

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match "mailpit-openshift-v*" 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "CHANGELOG=Initial release of mailpit-openshift." >> $GITHUB_OUTPUT
          else
            LOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s")
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "$LOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          
      - name: Get chart name
        id: chart
        run: |
          CHART_NAME=$(yq eval '.name' charts/mailpit-openshift/Chart.yaml)
          echo "chart_name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "Chart: $CHART_NAME"

      - name: Determine Chart Version and Git Tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.chart_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/mailpit-openshift-v* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/mailpit-openshift-}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            RAW_VERSION="${INPUT_VERSION}"
          else
            echo "::error::Chart version could not be determined"
            exit 1
          fi

          # Helm chart versions are plain SemVer 2.0 (https://semver.org) - no "v" prefix.
          # A leading "v" in the input is tolerated and stripped.
          CHART_VERSION="${RAW_VERSION#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "${CHART_VERSION}" =~ ${SEMVER_RE} ]]; then
            echo "::error::'${RAW_VERSION}' is not a valid SemVer version (expected e.g. 1.2.3)"
            exit 1
          fi

          # Git tags keep the existing "<chart>-v<version>" form so tag history and
          # changelog lookups stay continuous; only the chart version itself changes.
          GIT_TAG="mailpit-openshift-v${CHART_VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/${GIT_TAG}" >/dev/null; then
            echo "::error::Tag ${GIT_TAG} already exists - bump the version instead of re-releasing"
            exit 1
          fi

          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${GIT_TAG}"             >> "$GITHUB_OUTPUT"
          echo "Chart Version : ${CHART_VERSION}"
          echo "Git Tag       : ${GIT_TAG}"

      - name: Update Chart Version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.chart_version }}/" charts/mailpit-openshift/Chart.yaml

      - name: Build Dependency Package
        run: helm dependency build charts/mailpit-openshift

      - name: Package Chart
        run: helm package charts/mailpit-openshift

      - name: Configure Git Global
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Publish to Helm Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository_owner }}/coh-helm-repo.git artifacts-repo
          cd artifacts-repo
          git fetch origin
          git checkout gh-pages || git checkout -b gh-pages
          mkdir -p ${{ steps.chart.outputs.chart_name }}
          cp ../*.tgz ${{ steps.chart.outputs.chart_name }}/
          helm repo index . --url https://${{ github.repository_owner }}.github.io/coh-helm-repo --merge index.yaml
          git add .
          git commit -m "feat: Release ${{ steps.chart.outputs.chart_name }} ${{ steps.version.outputs.chart_version }}" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository_owner }}/coh-helm-repo.git gh-pages

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "mailpit-openshift-*.tgz"
          tag: ${{ steps.version.outputs.git_tag }}
          name: "mailpit-openshift ${{ steps.version.outputs.chart_version }}"
          body: |
            ## Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}