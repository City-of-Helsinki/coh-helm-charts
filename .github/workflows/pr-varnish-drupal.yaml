name: "PR: varnish-drupal"

on:
  pull_request:
    branches: [main]
    paths:
      - 'charts/varnish-drupal/**'
      - '.github/workflows/ci-varnish-drupal.yaml'
      - '.github/workflows/pr-varnish-drupal.yaml'
      - '.github/actions/**'
      - '.github/ci/**'
      - '.github/scripts/ci-cleanup.sh'
      - '.github/scripts/ci-prepare-namespace.sh'

# New pushes to the same PR cancel the previous run (its cleanup step still runs).
concurrency:
  group: pr-varnish-drupal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-varnish-drupal.yaml
    with:
      run-id: pr-${{ github.event.pull_request.number }}
    secrets: inherit
