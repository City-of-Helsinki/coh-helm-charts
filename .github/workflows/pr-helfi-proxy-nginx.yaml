name: "PR: helfi-proxy-nginx"

on:
  # Manual run (Actions -> this workflow -> Run workflow) tests the chart without a PR.
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'charts/helfi-proxy-nginx/**'
      - '.github/workflows/ci-helfi-proxy-nginx.yaml'
      - '.github/workflows/pr-helfi-proxy-nginx.yaml'
      - '.github/scripts/gixy-helm.sh'
      - '.github/actions/**'
      - '.github/ci/**'
      - '.github/scripts/ci-cleanup.sh'
      - '.github/scripts/ci-prepare-namespace.sh'

# New pushes to the same PR cancel the previous run (its cleanup step still runs).
concurrency:
  group: pr-helfi-proxy-nginx-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-helfi-proxy-nginx.yaml
    with:
      run-id: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('manual-{0}', github.run_number) }}
    secrets: inherit
