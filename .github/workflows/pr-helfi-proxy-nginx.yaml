name: PR validation for helfi-proxy-nginx Helm Chart

# PR-only. 
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'charts/helfi-proxy-nginx/**'
      - '.github/scripts/gixy-helm.sh'
      - '.github/workflows/pr-helfi-proxy-nginx.yaml'

# One deploy at a time per PR: a new push cancels the previous run's checks
concurrency:
  group: pr-helfi-proxy-nginx-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Set up Python (for gixy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.4.1
          pip install gixy-next==0.7.1

      - name: Lint and Validate
        run: |
          helm lint charts/helfi-proxy-nginx
          if [ -d "charts/helfi-proxy-nginx/tests" ]; then helm unittest charts/helfi-proxy-nginx; fi
          helm template charts/helfi-proxy-nginx -f charts/helfi-proxy-nginx/values-test.yaml | kubeconform -summary -skip Route
          helm template charts/helfi-proxy-nginx -f charts/helfi-proxy-nginx/values-dispatcher-test.yaml | kubeconform -summary -skip Route
          helm template charts/helfi-proxy-nginx -f charts/helfi-proxy-nginx/values-test.yaml -f charts/helfi-proxy-nginx/values-ratelimit-test.yaml | kubeconform -summary -skip Route

      - name: Gixy security scan (all scenarios)
        run: |
          declare -A SCENARIOS=(
            [receiver]="-f charts/helfi-proxy-nginx/values-test.yaml"
            [receiver-ratelimit]="-f charts/helfi-proxy-nginx/values-test.yaml -f charts/helfi-proxy-nginx/values-ratelimit-test.yaml"
            [dispatcher]="-f charts/helfi-proxy-nginx/values-dispatcher-test.yaml"
          )
          FAIL=0
          for name in "${!SCENARIOS[@]}"; do
            echo "::group::gixy - $name"
            # shellcheck disable=SC2086
            if ! .github/scripts/gixy-helm.sh \
                  --chart charts/helfi-proxy-nginx \
                  --name "$name" \
                  ${SCENARIOS[$name]} \
                  --map nginx.conf=/etc/nginx/nginx.conf \
                  --map server.conf=/etc/nginx/default.d/server.conf \
                  --optional-map redirections.conf=/etc/nginx/conf.d/redirections.conf \
                  --fail-on high; then
              echo "::error::gixy failed for scenario '$name'"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          exit $FAIL

  integration-test:
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NS: devops-toolchain
      PR: pr-${{ github.event.pull_request.number }}
      RELEASE: proxy-int-test-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Install OpenShift CLI
        run: |
          wget https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar xvf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Login to OpenShift
        run: |
          oc login ${{ secrets.OPENSHIFT_API_URL }} --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Deploy to Integration Namespace
        run: |
          helm upgrade --install $RELEASE charts/helfi-proxy-nginx \
            --namespace $NS \
            -f charts/helfi-proxy-nginx/values-test.yaml \
            --set route.host="helfi-proxy-int-test-${PR}.test.hel.ninja" \
            --wait

      - name: Verify Nginx Health
        run: |
          oc rollout status deployment/$RELEASE-helfi-proxy-nginx -n $NS
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://helfi-proxy-int-test-${PR}.test.hel.ninja/healthz")
          if [ "$STATUS" -ne 200 ]; then
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          helm uninstall $RELEASE -n $NS --no-hooks || true
