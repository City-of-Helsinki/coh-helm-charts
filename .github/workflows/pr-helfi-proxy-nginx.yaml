name: "PR: helfi-proxy-nginx"

on:
  pull_request:
    branches: [main]
    paths:
      - 'charts/helfi-proxy-nginx/**'
      - '.github/workflows/ci-helfi-proxy-nginx.yaml'
      - '.github/workflows/pr-helfi-proxy-nginx.yaml'
      - '.github/scripts/gixy-helm.sh'
      - '.github/actions/**'
      - '.github/ci/**'
      - '.github/scripts/ci-cleanup.sh'
      - '.github/scripts/ci-prepare-namespace.sh'

# New pushes to the same PR cancel the previous run (its cleanup step still runs).
concurrency:
  group: pr-helfi-proxy-nginx-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-helfi-proxy-nginx.yaml
    with:
      run-id: pr-${{ github.event.pull_request.number }}
    secrets: inherit
