name: "PR: elasticsearch"

on:
  # Manual run (Actions -> this workflow -> Run workflow) tests the chart without a PR.
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'charts/elasticsearch/**'
      - '.github/workflows/ci-elasticsearch.yaml'
      - '.github/workflows/pr-elasticsearch.yaml'
      - '.github/actions/**'

# New pushes to the same PR cancel the previous run.
concurrency:
  group: pr-elasticsearch-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-elasticsearch.yaml
