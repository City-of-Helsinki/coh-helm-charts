name: "CI: elasticsearch"

# Reusable: lint + unit tests for charts/elasticsearch.
# Called by pr-elasticsearch.yaml and release-elasticsearch.yaml so a PR is tested exactly
# like a release. No integration job yet: the chart needs the ECK
# operator (OLM) and the platta-service-ca ConfigMap, which come in a later PR.
on:
  workflow_call:

permissions:
  contents: read

env:
  CHART: charts/elasticsearch

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci-tools
        with:
          kubeconform: "false"   # the chart renders only the Elasticsearch CRD, which kubeconform cannot validate

      - name: helm lint (defaults and every values-*.yaml example)
        run: |
          helm lint --strict "$CHART"
          for f in "$CHART"/values-*.yaml; do
            [ -e "$f" ] || continue
            echo "::group::helm lint -f $f"
            helm lint --strict "$CHART" -f "$f"
            echo "::endgroup::"
          done

      - name: Unit tests
        run: |
          compgen -G "$CHART/tests/*_test.yaml" >/dev/null || { echo "::error::no $CHART/tests/*_test.yaml found"; exit 1; }
          helm unittest "$CHART"

      - name: values.schema.json rejects forbidden values
        # helm-unittest 0.4.1 cannot assert schema failures, so check them here
        run: |
          set -uo pipefail
          rc=0
          reject() {
            local desc="$1"; shift
            if out=$(helm template ci "$CHART" "$@" 2>&1); then
              echo "::error::accepted, should be rejected: $desc ($*)"; rc=1
            elif ! grep -q "values don't meet the specifications of the schema" <<<"$out"; then
              echo "::error::failed for another reason than the schema: $desc"; echo "$out"; rc=1
            else
              echo "✓ rejected: $desc"
            fi
          }
          reject "nodeCount 2"                 --set nodeCount=2
          reject "Elasticsearch 7.x"           --set version=7.17.29
          reject "Elasticsearch 8.19 (exception not implemented yet)" --set version=8.19.0
          reject "Elasticsearch 9.3"           --set version=9.3.0
          reject "storage class override"      --set storage.storageClassName=managed-csi
          reject "unknown top-level value"     --set route.enabled=true
          reject "missing memory limit"        --set resources.limits=null
          reject "third registry"              --set image.registry=quay.io
          reject "third repository"            --set image.repository=someone/elasticsearch
          reject "docker.elastic.co with the mirror repository" --set image.registry=docker.elastic.co
          reject "global.imageRegistry with the docker.elastic.co repository" --set image.repository=elasticsearch/elasticsearch
          reject "mirror registry with the docker.elastic.co repository" \
            --set image.registry=image-registry.int.platta.hel.fi --set image.repository=elasticsearch/elasticsearch
          reject "no registry at all (image.registry and global.imageRegistry empty)" --set global.imageRegistry=
          reject "custom image tag"            --set image.tag=1.0
          # users: u <name> <role> <indices JSON array> builds a one-user list
          u() { echo "users=[{\"name\":\"$1\",\"role\":\"$2\",\"indices\":$3}]"; }
          reject "user role admin"             --set-json "$(u myapp admin '["myapp-*"]')"
          reject "user role superuser"         --set-json "$(u myapp superuser '["myapp-*"]')"
          reject "user without indices"        --set-json 'users=[{"name":"myapp","role":"write"}]'
          reject "user with empty indices"     --set-json "$(u myapp write '[]')"
          reject "user without role"           --set-json 'users=[{"name":"myapp","indices":["myapp-*"]}]'
          reject "user with an unknown key"    --set-json 'users=[{"name":"myapp","role":"write","indices":["myapp-*"],"password":"x"}]'
          reject "index pattern *"             --set-json "$(u myapp search '["*"]')"
          reject "index pattern of wildcards only" --set-json "$(u myapp search '["*?*"]')"
          reject "system index pattern .*"     --set-json "$(u myapp search '[".*"]')"
          reject "system index .security"      --set-json "$(u myapp search '["myapp-*",".security"]')"
          reject "index list in one string"    --set-json "$(u myapp search '["a,b"]')"
          reject "reserved user elastic"       --set-json "$(u elastic write '["myapp-*"]')"
          reject "reserved user kibana"        --set-json "$(u kibana write '["myapp-*"]')"
          reject "reserved user kibana_system" --set-json "$(u kibana_system write '["myapp-*"]')"
          reject "ECK internal user"           --set-json "$(u elastic-internal-probe search '["myapp-*"]')"
          reject "user name not a DNS label"   --set-json "$(u MyApp write '["myapp-*"]')"
          reject "user name over 44 characters" --set-json "$(u a234567890123456789012345678901234567890-xyzw write '["myapp-*"]')"
          # Valid neighbours of the cases above must still pass (the schema is not just rejecting everything)
          accept() {
            local desc="$1"; shift
            if out=$(helm template ci "$CHART" "$@" 2>&1); then echo "✓ accepted: $desc"
            else echo "::error::rejected, should be accepted: $desc"; echo "$out"; rc=1; fi
          }
          accept "write and search users"      --set-json 'users=[{"name":"myapp-indexer","role":"write","indices":["myapp-*"]},{"name":"myapp-search","role":"search","indices":["myapp-*","shared-docs"]}]'
          accept "names that only start like reserved ones" \
            --set-json 'users=[{"name":"elastic-app","role":"search","indices":["a-*"]},{"name":"kibana-reader","role":"search","indices":["b?c*"]}]'
          accept "user name of 44 characters"  --set-json "$(u a234567890123456789012345678901234567890-xyz write '["myapp-*"]')"
          exit $rc
