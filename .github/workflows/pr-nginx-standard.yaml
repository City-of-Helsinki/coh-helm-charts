name: PR validation for nginx-standard Helm Chart

# PR-only. 
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'charts/nginx-standard/**'
      - '.github/scripts/gixy-helm.sh'
      - '.github/scripts/test-nginx-standard-usecase.sh'
      - '.github/workflows/pr-nginx-standard.yaml'

concurrency:
  group: pr-nginx-standard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python (for gixy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.3.0 --verify=false
          pip install gixy-next==0.7.1

      - name: Lint chart
        run: helm lint charts/nginx-standard/

      - name: Run unit tests
        run: |
          if [ -f "charts/nginx-standard/tests/unit-test.yaml" ] || \
             [ -f "charts/nginx-standard/tests/deployment_test.yaml" ]; then
            helm unittest charts/nginx-standard/
          else
            echo "No unit test files found in tests/ directory, skipping unit tests"
          fi

      - name: Validate every use-case (rendering, kubeconform, gixy, use-case checks)
        run: |
          chmod +x .github/scripts/test-nginx-standard-usecase.sh
          FAIL=0
          for uc in filesharing elasticproxy cache frontproxy; do
            echo "::group::$uc"
            .github/scripts/test-nginx-standard-usecase.sh "$uc" || FAIL=1
            echo "::endgroup::"
          done
          exit $FAIL

  integration-test:
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OpenShift CLI
        run: |
          wget https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar xvf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/
          oc version --client

      - name: Login to OpenShift Dev Cluster
        run: |
          oc login ${{ secrets.OPENSHIFT_API_URL }} --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Set namespace context
        run: |
          oc project nginx-demo || oc new-project nginx-demo
          echo "Using namespace: nginx-demo"

      - name: Clean up this PR's previous test deployments
        run: |
          helm list -n nginx-demo --filter "^test-${PR}-" -q | xargs -r -n1 helm uninstall -n nginx-demo || true
          sleep 5

      - name: Test all four use-cases
        run: |
          set +e  # collect every result — one use-case failing must not stop the others

          declare -A VALUES_FILE=(
            [elasticproxy]="charts/nginx-standard/values-elasticproxy.yaml"
            [cache]="charts/nginx-standard/values-cache.yaml"
            [frontproxy]="charts/nginx-standard/values-frontproxy.yaml"
            [filesharing]="charts/nginx-standard/values-filesharing.yaml"
          )
          declare -A EXTRA_SET=(
            [elasticproxy]=""
            [cache]=""
            [frontproxy]=""
            # values-filesharing.yaml defaults to a static Azure File PV (a single
            # pre-created PV, not safe for concurrent PR deploys) plus an
            # ExternalSecret backed by a real Key Vault. Both disabled here so
            # this only needs the cluster itself — the real static/PVC/
            # ExternalSecret manifests are still schema-checked, unmodified, by
            # kubeconform in the `validate` job. This only proves the pod starts
            # and serves traffic, not that Azure File actually works.
            [filesharing]="--set fileSharing.storage.pvc.enabled=false --set externalSecrets.enabled=false"
          )

          deploy_and_verify() {
            local uc="$1"
            local release="test-${PR}-${uc}"
            {
              echo "== [$uc] installing"
              # shellcheck disable=SC2086
              helm install "$release" charts/nginx-standard/ \
                -n nginx-demo \
                -f "${VALUES_FILE[$uc]}" \
                ${EXTRA_SET[$uc]} \
                --wait --timeout 3m \
              && oc rollout status "deployment/${release}-nginx-standard" -n nginx-demo --timeout=3m \
              && POD_NAME=$(oc get pods -n nginx-demo -l "app.kubernetes.io/name=nginx-standard,app.kubernetes.io/instance=${release}" -o jsonpath="{.items[0].metadata.name}") \
              && oc exec -n nginx-demo "$POD_NAME" -- curl -f http://localhost:8080/readiness \
              && oc exec -n nginx-demo "$POD_NAME" -- curl -f http://localhost:8080/healthz \
              && echo "== [$uc] deployed and healthy"
            } > "/tmp/log-${uc}.txt" 2>&1
            echo $? > "/tmp/exit-${uc}.txt"
          }

          # NOTE: values-elasticproxy.yaml hardcodes secretName
          oc create secret generic "test-${PR}-elastic-creds" \
            -n nginx-demo \
            --from-literal=elastic=testpass123 \
            --dry-run=client -o yaml | oc apply -f -

          for uc in elasticproxy cache frontproxy filesharing; do
            deploy_and_verify "$uc" &
          done
          wait

          FAIL=0
          for uc in elasticproxy cache frontproxy filesharing; do
            echo "::group::$uc"
            cat "/tmp/log-${uc}.txt"
            echo "::endgroup::"
            code=$(cat "/tmp/exit-${uc}.txt")
            if [ "$code" -ne 0 ]; then
              echo "::error::[$uc] deployment/verification failed (exit $code)"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Display deployment summary
        if: always()
        run: |
          for uc in elasticproxy cache frontproxy filesharing; do
            echo "=== $uc ==="
            oc get all -n nginx-demo -l "app.kubernetes.io/instance=test-${PR}-${uc}"
            echo ""
          done

      - name: Collect logs on failure
        if: failure()
        run: |
          for uc in elasticproxy cache frontproxy filesharing; do
            echo "--- $uc ---"
            POD=$(oc get pods -n nginx-demo -l "app.kubernetes.io/instance=test-${PR}-${uc}" -o jsonpath="{.items[0].metadata.name}" 2>/dev/null || echo "")
            if [ -n "$POD" ]; then
              oc logs -n nginx-demo "$POD" --tail=100 || echo "No logs available"
              oc describe pod -n nginx-demo "$POD" || echo "Cannot describe pod"
            fi
            echo ""
          done

      - name: Cleanup this PR's test deployments
        if: always()
        run: |
          for uc in elasticproxy cache frontproxy filesharing; do
            helm uninstall "test-${PR}-${uc}" -n nginx-demo || true
          done
          oc delete secret "test-${PR}-elastic-creds" -n nginx-demo || true
          echo "Cleanup complete"
