name: "PR: nginx-standard"

on:
  pull_request:
    branches: [main]
    paths:
      - 'charts/nginx-standard/**'
      - '.github/workflows/ci-nginx-standard.yaml'
      - '.github/workflows/pr-nginx-standard.yaml'
      - '.github/scripts/test-nginx-standard-usecase.sh'
      - '.github/scripts/gixy-helm.sh'
      - '.github/scripts/ci-elasticsearch.sh'
      - '.github/scripts/ci-nginx-deploy.sh'
      - '.github/scripts/ci-nginx-e2e.sh'
      - '.github/actions/**'
      - '.github/ci/**'
      - '.github/scripts/ci-cleanup.sh'
      - '.github/scripts/ci-prepare-namespace.sh'

# New pushes to the same PR cancel the previous run (its cleanup step still runs).
concurrency:
  group: pr-nginx-standard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-nginx-standard.yaml
    with:
      run-id: pr-${{ github.event.pull_request.number }}
    secrets: inherit
