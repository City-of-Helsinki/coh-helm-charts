name: Release redis-cluster Helm Chart

on:
  push:
    tags:
      - 'redis-cluster-v*'  # e.g., redis-cluster-v1.2.3
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Chart version (e.g., 1.0.1 or v1.0.1 - v prefix optional)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install test dependencies
        run: |
          # Install kubeconform for manifest validation
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

          # Install yq for YAML processing
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

          # Install helm-unittest plugin
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.3.0 --verify=false

      - name: Lint chart
        run: |
          helm lint charts/redis-cluster/

      - name: Run unit tests
        run: |
          if ls charts/redis-cluster/tests/*_test.yaml 1>/dev/null 2>&1; then
            helm unittest charts/redis-cluster/
          else
            echo "No unit test files found in tests/ directory, skipping unit tests"
          fi

      - name: Test default template rendering
        run: |
          helm template test-redis-cluster charts/redis-cluster/ --debug

      - name: Validate manifests against Kubernetes schemas
        run: |
          helm template test-redis-cluster charts/redis-cluster/ \
            --exclude charts/redis-cluster/templates/tests/* \
            | yq eval 'select(.kind != null)' - \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -

      - name: Validate manifests with persistence enabled
        run: |
          helm template test-redis-cluster-pvc charts/redis-cluster/ \
            --set redis.persistence.enabled=true \
            --set redis.persistence.size=2Gi \
            --exclude charts/redis-cluster/templates/tests/* \
            | yq eval 'select(.kind != null)' - \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -

      - name: Validate manifests with PDB enabled
        run: |
          helm template test-redis-cluster-pdb charts/redis-cluster/ \
            --set redis.pdb.enabled=true \
            --set redis.pdb.minAvailable=1 \
            --exclude charts/redis-cluster/templates/tests/* \
            | yq eval 'select(.kind != null)' - \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -

      - name: Validate manifests with existing secret
        run: |
          helm template test-redis-cluster-secret charts/redis-cluster/ \
            --set redis.password.existingSecret=my-redis-secret \
            --set redis.password.secretKey=REDIS_PASSWORD \
            --exclude charts/redis-cluster/templates/tests/* \
            | yq eval 'select(.kind != null)' - \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -

      - name: Validate manifests with custom replica counts
        run: |
          helm template test-redis-cluster-replicas charts/redis-cluster/ \
            --set redis.replicaCount=3 \
            --set sentinel.replicaCount=3 \
            --exclude charts/redis-cluster/templates/tests/* \
            | yq eval 'select(.kind != null)' - \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.27.0 -

      - name: Validate Redis StatefulSet structure
        run: |
          echo "Checking Redis StatefulSet is generated..."
          helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "StatefulSet" and .metadata.name == "*-redis")' - > /tmp/redis-sts.yaml

          if [ ! -s /tmp/redis-sts.yaml ]; then
            echo "ERROR: Redis StatefulSet not found in rendered manifests"
            exit 1
          fi
          echo "✓ Redis StatefulSet present"

          # Confirm the init container for config bootstrapping is present
          helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "StatefulSet") | .spec.template.spec.initContainers[].name' - \
            | grep -q "config"

          if [ $? -ne 0 ]; then
            echo "ERROR: Init container 'config' not found in Redis StatefulSet"
            exit 1
          fi
          echo "✓ Redis init container present"

      - name: Validate Sentinel StatefulSet structure
        run: |
          echo "Checking Sentinel StatefulSet is generated..."
          helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "StatefulSet" and .metadata.name == "*-sentinel")' - > /tmp/sentinel-sts.yaml

          if [ ! -s /tmp/sentinel-sts.yaml ]; then
            echo "ERROR: Sentinel StatefulSet not found in rendered manifests"
            exit 1
          fi
          echo "✓ Sentinel StatefulSet present"

          # Confirm sentinel init container is present
          helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "StatefulSet") | .spec.template.spec.initContainers[].name' - \
            | grep -q "config"

          if [ $? -ne 0 ]; then
            echo "ERROR: Init container 'config' not found in Sentinel StatefulSet"
            exit 1
          fi
          echo "✓ Sentinel init container present"

      - name: Validate Services
        run: |
          echo "Checking all required Services are generated..."
          SERVICES=$(helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "Service") | .metadata.name' -)

          # Headless service for Redis
          echo "$SERVICES" | grep -q "\-headless"
          if [ $? -ne 0 ]; then
            echo "ERROR: Redis headless Service not found"
            exit 1
          fi
          echo "✓ Redis headless Service present"

          # Sentinel service
          echo "$SERVICES" | grep -q "\-sentinel$"
          if [ $? -ne 0 ]; then
            echo "ERROR: Sentinel Service not found"
            exit 1
          fi
          echo "✓ Sentinel Service present"

          # Sentinel headless service
          echo "$SERVICES" | grep -q "\-sentinel-headless"
          if [ $? -ne 0 ]; then
            echo "ERROR: Sentinel headless Service not found"
            exit 1
          fi
          echo "✓ Sentinel headless Service present"

      - name: Validate ConfigMaps
        run: |
          echo "Checking ConfigMaps are generated..."
          CONFIGMAPS=$(helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "ConfigMap") | .metadata.name' -)

          # Scripts ConfigMap
          echo "$CONFIGMAPS" | grep -q "\-scripts"
          if [ $? -ne 0 ]; then
            echo "ERROR: Scripts ConfigMap not found"
            exit 1
          fi
          echo "✓ Scripts ConfigMap present"

          # Config ConfigMap
          echo "$CONFIGMAPS" | grep -q "\-config"
          if [ $? -ne 0 ]; then
            echo "ERROR: Config ConfigMap not found"
            exit 1
          fi
          echo "✓ Config ConfigMap present"

          # Verify redis.conf and sentinel.conf are present in the config ConfigMap
          helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "ConfigMap" and .metadata.name == "*-config") | .data | keys' - \
            | grep -q "redis.conf"
          if [ $? -ne 0 ]; then
            echo "ERROR: redis.conf not found in config ConfigMap"
            exit 1
          fi
          echo "✓ redis.conf present in config ConfigMap"

          helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "ConfigMap" and .metadata.name == "*-config") | .data | keys' - \
            | grep -q "sentinel.conf"
          if [ $? -ne 0 ]; then
            echo "ERROR: sentinel.conf not found in config ConfigMap"
            exit 1
          fi
          echo "✓ sentinel.conf present in config ConfigMap"

          # Verify redis_init.sh and sentinel_init.sh are present in scripts ConfigMap
          helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "ConfigMap" and .metadata.name == "*-scripts") | .data | keys' - \
            | grep -q "redis_init.sh"
          if [ $? -ne 0 ]; then
            echo "ERROR: redis_init.sh not found in scripts ConfigMap"
            exit 1
          fi
          echo "✓ redis_init.sh present in scripts ConfigMap"

          helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "ConfigMap" and .metadata.name == "*-scripts") | .data | keys' - \
            | grep -q "sentinel_init.sh"
          if [ $? -ne 0 ]; then
            echo "ERROR: sentinel_init.sh not found in scripts ConfigMap"
            exit 1
          fi
          echo "✓ sentinel_init.sh present in scripts ConfigMap"

      - name: Validate Secret behaviour
        run: |
          echo "Checking Secret is generated when no existingSecret is set..."
          helm template test-redis-cluster charts/redis-cluster/ \
            | yq eval 'select(.kind == "Secret")' - > /tmp/secret.yaml

          if [ ! -s /tmp/secret.yaml ]; then
            echo "ERROR: Secret not generated when existingSecret is unset"
            exit 1
          fi
          echo "✓ Secret generated when existingSecret is unset"

          echo "Checking Secret is NOT generated when existingSecret is provided..."
          helm template test-redis-cluster charts/redis-cluster/ \
            --set redis.password.existingSecret=my-redis-secret \
            | yq eval 'select(.kind == "Secret")' - > /tmp/secret-suppressed.yaml

          if [ -s /tmp/secret-suppressed.yaml ]; then
            echo "ERROR: Secret should not be generated when existingSecret is set"
            exit 1
          fi
          echo "✓ Secret suppressed when existingSecret is set"

      - name: Validate PDB behaviour
        run: |
          echo "Checking both Redis and Sentinel PDBs are generated by default (enabled: true in values.yaml)..."
          COUNT=$(helm template test-redis-cluster charts/redis-cluster/ \
            | grep -c "kind: PodDisruptionBudget" || true)

          if [ "$COUNT" -ne 2 ]; then
            echo "ERROR: Expected 2 PodDisruptionBudgets (redis + sentinel) by default, got $COUNT"
            exit 1
          fi
          echo "✓ Both Redis and Sentinel PDBs present with default values"

          echo "Checking PDB is NOT generated when explicitly disabled..."
          COUNT=$(helm template test-redis-cluster charts/redis-cluster/ \
            --set redis.pdb.enabled=false \
            --set sentinel.pdb.enabled=false \
            | grep -c "kind: PodDisruptionBudget" || true)

          if [ "$COUNT" -ne 0 ]; then
            echo "ERROR: PDB should not be generated when redis.pdb.enabled=false and sentinel.pdb.enabled=false"
            exit 1
          fi
          echo "✓ PDB absent when explicitly disabled"

      - name: Validate persistence behaviour
        run: |
          echo "Checking emptyDir is used when persistence is disabled..."
          VOLUMES=$(helm template test-redis-cluster charts/redis-cluster/ \
            --set redis.persistence.enabled=false \
            | yq eval 'select(.kind == "StatefulSet" and .metadata.name == "*-redis") | .spec.template.spec.volumes[] | select(.name == "data") | .emptyDir' -)

          if [ -z "$VOLUMES" ]; then
            echo "ERROR: emptyDir not set for data volume when persistence is disabled"
            exit 1
          fi
          echo "✓ emptyDir used when persistence disabled"

          echo "Checking volumeClaimTemplates are set when persistence is enabled..."
          helm template test-redis-cluster charts/redis-cluster/ \
            --set redis.persistence.enabled=true \
            --set redis.persistence.size=2Gi \
            | yq eval 'select(.kind == "StatefulSet" and .metadata.name == "*-redis") | .spec.volumeClaimTemplates' - > /tmp/vct.yaml

          if [ ! -s /tmp/vct.yaml ] || grep -q "^null$" /tmp/vct.yaml; then
            echo "ERROR: volumeClaimTemplates not set when persistence is enabled"
            exit 1
          fi
          echo "✓ volumeClaimTemplates present when persistence enabled"

  integration-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OpenShift CLI
        run: |
          wget https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar xvf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/
          oc version --client

      - name: Login to OpenShift Dev Cluster
        run: |
          oc login ${{ secrets.OPENSHIFT_API_URL }} --token="${{ secrets.OPENSHIFT_TOKEN }}" --insecure-skip-tls-verify

      - name: Set namespace context
        run: |
          oc project redis-demo || oc new-project redis-demo
          echo "Using namespace: redis-demo"

      - name: Clean up previous test deployments
        run: |
          echo "Cleaning up any existing test deployments..."
          helm list -n redis-demo | grep '^test-' | awk '{print $1}' | xargs -r helm uninstall -n redis-demo || true
          sleep 10

      - name: Create test secret for Redis password
        run: |
          oc create secret generic test-redis-secret \
            -n redis-demo \
            --from-literal=REDIS_PASSWORD=testpass123 \
            --dry-run=client -o yaml | oc apply -f -

      - name: Deploy redis-cluster chart
        run: |
          helm install test-redis-cluster charts/redis-cluster/ \
            -n redis-demo \
            --set redis.password.existingSecret=test-redis-secret \
            --set redis.password.secretKey=REDIS_PASSWORD \
            --wait --timeout 5m

      - name: Verify Redis StatefulSet rollout
        run: |
          oc rollout status statefulset/test-redis-cluster-redis -n redis-demo --timeout=5m
          echo "✓ Redis StatefulSet rolled out"

      - name: Verify Sentinel StatefulSet rollout
        run: |
          oc rollout status statefulset/test-redis-cluster-sentinel -n redis-demo --timeout=5m
          echo "✓ Sentinel StatefulSet rolled out"

      - name: Smoke test Redis pods
        run: |
          for i in 0 1 2; do
            POD="test-redis-cluster-redis-${i}"
            echo "Testing pod: $POD"
            oc exec -n redis-demo $POD -- \
              redis-cli -a testpass123 --no-auth-warning ping | grep -q "PONG"
            echo "✓ $POD is responding"
          done

      - name: Smoke test Sentinel pods
        run: |
          for i in 0 1 2; do
            POD="test-redis-cluster-sentinel-${i}"
            echo "Testing pod: $POD"
            oc exec -n redis-demo $POD -- \
              redis-cli -p 26379 -a testpass123 --no-auth-warning ping | grep -q "PONG"
            echo "✓ $POD is responding"
          done

      - name: Verify Sentinel knows the master
        run: |
          POD="test-redis-cluster-sentinel-0"
          echo "Querying sentinel for master info..."
          oc exec -n redis-demo $POD -- \
            redis-cli -p 26379 -a testpass123 --no-auth-warning sentinel master mymaster \
            | grep -q "flags"
          echo "✓ Sentinel master info returned successfully"

      - name: Display deployment summary
        if: always()
        run: |
          echo "=== Deployment Summary ==="
          oc get all -n redis-demo -l 'app.kubernetes.io/name=redis-sentinel'

          echo ""
          echo "=== Pod Status ==="
          oc get pods -n redis-demo -l 'app.kubernetes.io/name=redis-sentinel' -o wide

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Collecting logs from failed pods ==="
          for component in redis sentinel; do
            echo "--- Logs for component: $component ---"
            for POD in $(oc get pods -n redis-demo \
              -l "app.kubernetes.io/instance=test-redis-cluster,app.kubernetes.io/component=$component" \
              -o jsonpath="{.items[*].metadata.name}"); do
              echo "  Pod: $POD"
              oc logs -n redis-demo $POD --all-containers --tail=100 || echo "No logs available"
              echo ""
              oc describe pod -n redis-demo $POD || echo "Cannot describe pod"
              echo ""
            done
          done

      - name: Cleanup test deployments
        if: always()
        run: |
          echo "Cleaning up..."
          helm uninstall test-redis-cluster -n redis-demo || true
          oc delete secret test-redis-secret -n redis-demo || true
          echo "Cleanup complete"

  generate-changelog:
    needs: [test, integration-test]
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag -l "redis-cluster-v*" --sort=-v:refname | head -n 2 | tail -n 1 || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, generating full history"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -- charts/redis-cluster/)
          else
            echo "Generating changelog from $PREVIOUS_TAG to HEAD"
            COMMITS=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges -- charts/redis-cluster/)
          fi

          FEATURES=$(echo "$COMMITS" | grep -i "^- feat"  || echo "")
          FIXES=$(echo "$COMMITS"    | grep -i "^- fix"   || echo "")
          DOCS=$(echo "$COMMITS"     | grep -i "^- docs"  || echo "")
          CHORES=$(echo "$COMMITS"   | grep -i "^- chore" || echo "")
          OTHERS=$(echo "$COMMITS"   | grep -iv "^- \(feat\|fix\|docs\|chore\)" || echo "")

          CHANGELOG=""
          [ -n "$FEATURES" ] && CHANGELOG="${CHANGELOG}### ✨ Features\n${FEATURES}\n\n"
          [ -n "$FIXES"    ] && CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n${FIXES}\n\n"
          [ -n "$DOCS"     ] && CHANGELOG="${CHANGELOG}### 📚 Documentation\n${DOCS}\n\n"
          [ -n "$CHORES"   ] && CHANGELOG="${CHANGELOG}### 🔧 Maintenance\n${CHORES}\n\n"
          [ -n "$OTHERS"   ] && CHANGELOG="${CHANGELOG}### Other Changes\n${OTHERS}\n\n"
          [ -z "$CHANGELOG" ] && CHANGELOG="No significant changes detected."

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG"  >> $GITHUB_OUTPUT
          echo "EOF"            >> $GITHUB_OUTPUT

  release:
    needs: [test, integration-test, generate-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: sudo snap install yq

      - name: Determine Chart Version and Git Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/redis-cluster-v* ]]; then
            CHART_VERSION=${GITHUB_REF#refs/tags/redis-cluster-}
            GIT_TAG=${GITHUB_REF#refs/tags/}
          elif [ -n "${{ github.event.inputs.chart_version }}" ]; then
            INPUT_VERSION="${{ github.event.inputs.chart_version }}"
            CLEAN_VERSION="${INPUT_VERSION#v}"
            CHART_VERSION="v${CLEAN_VERSION}"
            GIT_TAG="redis-cluster-${CHART_VERSION}"
          else
            echo "Error: Chart version could not be determined"
            exit 1
          fi

          echo "chart_version=$CHART_VERSION" >> $GITHUB_OUTPUT
          echo "git_tag=$GIT_TAG"             >> $GITHUB_OUTPUT
          echo "Chart Version : $CHART_VERSION"
          echo "Git Tag       : $GIT_TAG"

      - name: Get chart name
        id: chart
        run: |
          CHART_NAME=$(yq eval '.name' charts/redis-cluster/Chart.yaml)
          echo "chart_name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "Chart: $CHART_NAME"

      - name: Update Chart.yaml version
        run: |
          yq eval -i '.version = "${{ steps.version.outputs.chart_version }}"' charts/redis-cluster/Chart.yaml
          echo "Updated Chart.yaml to ${{ steps.version.outputs.chart_version }}"

      - name: Package chart
        run: |
          helm package charts/redis-cluster/ --version ${{ steps.version.outputs.chart_version }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Publish to Helm Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository_owner }}/coh-helm-repo.git artifacts-repo
          cd artifacts-repo

          git checkout gh-pages || git checkout -b gh-pages

          mkdir -p ${{ steps.chart.outputs.chart_name }}
          cp ../*.tgz ${{ steps.chart.outputs.chart_name }}/

          helm repo index . --url https://${{ github.repository_owner }}.github.io/coh-helm-repo --merge index.yaml

          git add .
          git commit -m "feat: Release ${{ steps.chart.outputs.chart_name }} ${{ steps.version.outputs.chart_version }}" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository_owner }}/coh-helm-repo.git gh-pages

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.tgz"
          body: |
            # redis-cluster Helm Chart ${{ steps.version.outputs.chart_version }}

            ## Changelog

            ${{ needs.generate-changelog.outputs.changelog }}

            ## Documentation

            - [Full Documentation](https://github.com/${{ github.repository }}/blob/main/charts/redis-cluster/README.md)
            - [Values Reference](https://github.com/${{ github.repository }}/blob/main/charts/redis-cluster/values.yaml)
          tag: ${{ steps.version.outputs.git_tag }}
          name: "redis-cluster ${{ steps.version.outputs.chart_version }}"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}